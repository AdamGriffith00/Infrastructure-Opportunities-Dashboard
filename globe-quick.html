<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Globe Quick Test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body,#globe { height:100%; margin:0; background:#000; }
    #tip { position:fixed; top:10px; left:10px; color:#fff; font:14px/1.4 system-ui; }
  </style>
</head>
<body>
  <div id="globe"></div>
  <div id="tip">Drag to spin • Scroll to zoom • Click a country</div>

  <!-- libs -->
  <script src="https://unpkg.com/three/build/three.min.js"></script>
  <script src="https://unpkg.com/three-globe"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <script src="https://unpkg.com/d3-geo@3"></script>

  <script>
    const el = document.getElementById('globe');
    const Globe = window.Globe;

    const globe = Globe()(el)
      .backgroundColor('#000000')
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
      .showAtmosphere(true)
      .atmosphereAltitude(0.12);

    fetch('https://unpkg.com/world-atlas@2/countries-110m.json')
      .then(r => r.json())
      .then(topology => {
        const features = topojson.feature(topology, topology.objects.countries).features;
        features.forEach(f => {
          if (!f.id && f.properties?.iso_a3) f.id = f.properties.iso_a3.toUpperCase();
        });

        globe
          .polygonsData(features)
          .polygonCapColor(() => '#666')
          .polygonSideColor(() => 'rgba(0,0,0,0.2)')
          .polygonStrokeColor(() => 'rgba(255,255,255,0.7)')
          .polygonsTransitionDuration(300)
          .onPolygonClick(feat => {
            const [lng, lat] = d3.geoCentroid(feat);
            globe.pointOfView({ lat, lng, altitude: 0.8 }, 1000);
          });

        globe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1000);
      });
  </script>
</body>
</html>
