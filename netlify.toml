########################################
# Netlify configuration for Growth Portal
########################################
[build]
  command = "npm run build && echo '--- LIST /globe ---' && ls -l globe || true && echo '--- LIST /globe/assets ---' && ls -l globe/assets || true"
  publish = "."
  functions = "netlify/functions"

# route the naked /globe to the file (do NOT add a wildcard here)
[[redirects]]
  from = "/globe"
  to   = "/globe/index.html"
  status = 200
  force = true
  
########################################
# Headers
########################################

[[headers]]
  for = "/index.html"
  [headers.values]
    # Remove if you don't want basic auth on home
    Basic-Auth = "myuser mypassword"

########################################
# Scheduled Functions
########################################

[functions."update-tenders-background"]
  schedule = "5 9 * * *"

[functions."mi-archive"]
  schedule = "5 1 * * *"

[functions."frameworks-update-background"]
  schedule = "15 2 * * *"

########################################
# Redirects (API aliases)
########################################

[[redirects]]
  from = "/api/latest"
  to   = "/.netlify/functions/latest"
  status = 200
  force = true

[[redirects]]
  from = "/api/update-tenders"
  to   = "/.netlify/functions/update-tenders"
  status = 200
  force = true

[[redirects]]
  from = "/api/update-tenders-background"
  to   = "/.netlify/functions/update-tenders-background"
  status = 200
  force = true

[[redirects]]
  from = "/api/mi-forecast"
  to   = "/.netlify/functions/mi-forecast"
  status = 200
  force = true

[[redirects]]
  from = "/api/mi-signals"
  to   = "/.netlify/functions/mi-signals"
  status = 200
  force = true

[[redirects]]
  from = "/api/mi-frameworks-rebid"
  to   = "/.netlify/functions/mi-frameworks-rebid"
  status = 200
  force = true
