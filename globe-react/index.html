<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Interactive Globe</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background:#000; }
      /* small helper so the top bar doesn’t overlap */
      .app { height: 100%; display: flex; flex-direction: column; }
      .topbar { position: sticky; top: 0; z-index: 20; }
      .canvas { flex: 1; min-height: 0; }
      /* basic button */
      .btn {
        appearance: none; border: 1px solid rgba(255,255,255,.2);
        background: rgba(255,255,255,.06); color: #fff; border-radius: 8px;
        padding: 6px 10px; cursor: pointer;
      }
      .panel {
        background: rgba(255,255,255,.08);
        color: #fff; border: 1px solid rgba(255,255,255,.15);
        border-radius: 14px; backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/globe/src/main.jsx"></script>
  </body>
</html>
