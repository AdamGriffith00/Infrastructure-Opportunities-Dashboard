<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Interactive 3D Globe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; background:#000; color:#ddd; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #toolbar {
      position: fixed; top: 10px; left: 10px; z-index: 10; display: flex; gap: 8px; align-items: center;
      background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 6px 8px; backdrop-filter: blur(6px);
    }
    .btn {
      font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,.15);
      background: #111; color: #ddd;
    }
    .btn[disabled] { opacity: .45; cursor: default; }
    .legend {
      position: fixed; right: 12px; bottom: 12px; z-index: 10; font-size: 12px; line-height: 1.3;
      background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 8px 10px; backdrop-filter: blur(6px);
    }
    .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
    #hint { position: fixed; left: 12px; bottom: 10px; z-index: 10; font-size: 12px; color: #ccc; opacity: .8; }
    #globe { position: absolute; inset: 0; }
    #toast {
      position: fixed; right: 12px; top: 12px; z-index: 11; font-size: 12px; color:#9fe29f; white-space: pre-line;
      background: rgba(0,0,0,.55); border: 1px solid rgba(0,0,0,.9); border-radius: 10px; padding: 8px 10px; max-width: 40ch;
    }
    .badge { display:inline-block; padding:2px 6px; border-radius: 6px; margin-left: 6px; font-size: 11px; background:#222; border:1px solid rgba(255,255,255,.12); }
  </style>
</head>
<body>

  <div id="toolbar">
    <button id="btnBackWorld" class="btn" disabled>← Back to world</button>
    <button id="btnReset" class="btn">Reset view</button>
    <span id="mode" class="badge">World</span>
  </div>

  <div class="legend">
    <div><span class="key" style="background:#FFC300"></span>Gleeds presence</div>
    <div><span class="key" style="background:#666"></span>Other countries</div>
  </div>

  <div id="hint">Drag to spin • Scroll to zoom • Click a yellow country • Click a state when USA is active</div>
  <div id="toast" style="display:none"></div>

  <div id="globe"></div>

  <!-- Local vendor libs -->
  <script src="/assets/vendor/three.min.js"></script>
  <script src="/assets/vendor/OrbitControls.js"></script>
  <script src="/assets/vendor/d3-geo.v1.min.js"></script>
  <script src="/assets/vendor/three-globe.min.js"></script>

  <script>
  // ---------- CONFIG (change paths if needed)
  const WORLD_URL = '/assets/world-110m.geojson';
  const USA_STATES_URL = '/assets/overlays/usa-states.geojson';

  const GLEEDS_YELLOW = '#FFC300';
  const NON_GLEEDS_GREY = '#666';
  const HOVER_BORDER = '#FFFFFF';
  const DEFAULT_BORDER = 'rgba(0,0,0,0.65)';

  // ISO3 codes we want in yellow (trim this later if you like)
  const GLEEDS_COUNTRIES = new Set([
    'GBR','IRL','AUT','CZE','FRA','DEU','HUN','ITA','POL','PRT','ROU','SVK','ESP','UKR',
    'EGY','QAT','SAU','ARE',
    'AUS','CHN','HKG','IND','SGP','VNM',
    'CAN','PER','TTO','USA',
    'BGR','HRV','MNE','SRB','BEL','CHE','LUX','GRC','DNK','FIN','NLD','NOR','SWE',
    'ZAF','LKA','ECU'
  ]);

  // ---------- small helpers
  const $ = sel => document.querySelector(sel);
  function toast(msg, ms = 1600) {
    const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast._id); toast._id = setTimeout(()=>t.style.display='none', ms);
  }
  const centroidOf = feat => {
    try { return d3.geoCentroid(feat); } catch { return [0,0]; }
  };
  const boundsOf = feat => {
    try { return d3.geoBounds(feat); } catch { return [[-10,-10],[10,10]]; }
  };
  function altitudeForFeature(feat) {
    const [[minLng, minLat],[maxLng,maxLat]] = boundsOf(feat);
    const latSpan = Math.max(0.0001, Math.abs(maxLat - minLat));
    const midLat = (maxLat + minLat) / 2;
    const lngSpan = Math.max(0.0001, Math.abs(maxLng - minLng)) * Math.cos(Math.abs(midLat)*Math.PI/180);
    const span = Math.max(latSpan, lngSpan);
    if (span > 60) return 1.6;
    if (span > 30) return 1.2;
    if (span > 15) return 0.9;
    if (span >  8) return 0.65;
    if (span >  4) return 0.50;
    if (span >  2) return 0.38;
    return 0.28;
  }

  // ---------- state
  let worldFeatures = [];
  let activeOverlay = null; // { name, data, colorFn, strokeFn, onClick }
  let focusFeature = null;

  // ---------- globe init
  const globe = new ThreeGlobe.Globe()
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
    .showAtmosphere(true)
    .atmosphereAltitude(0.11)
    .backgroundColor('#000000');

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  $('#globe').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.add(globe);

  const camera = new THREE.PerspectiveCamera();
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  camera.position.z = 500;

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.12;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.minDistance = 160;
  controls.maxDistance = 800;

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  (function animate() {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  })();

  // ---------- world view
  function paintWorld(feats) {
    $('#mode').textContent = 'World';
    $('#btnBackWorld').disabled = true;
    activeOverlay = null;

    globe
      .polygonsData(feats)
      .polygonCapColor(d => GLEEDS_COUNTRIES.has(d.id) ? GLEEDS_YELLOW : NON_GLEEDS_GREY)
      .polygonSideColor(d => d.__hover ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.18)')
      .polygonStrokeColor(d => d.__hover ? HOVER_BORDER : DEFAULT_BORDER)
      .polygonAltitude(d => d.__hover ? 0.06 : 0.01)
      .polygonLabel(d => `<b>${d.properties?.name || d.id}</b>`)
      .onPolygonHover(d => {
        feats.forEach(f => f.__hover = false);
        if (d && GLEEDS_COUNTRIES.has(d.id)) d.__hover = true;
      })
      .onPolygonClick(async d => {
        if (!d || !GLEEDS_COUNTRIES.has(d.id)) return;
        focusFeature = d;
        const [lng, lat] = centroidOf(d);
        controls.autoRotate = false;
        globe.pointOfView({ lat, lng, altitude: altitudeForFeature(d) }, 1200);

        // overlays by ISO3
        if (d.id === 'USA') {
          await activateOverlay({
            name: 'USA States',
            url: USA_STATES_URL,
            focus: d,
            color: f => GLEEDS_YELLOW,
            stroke: () => '#222',
            onClick: st => {
              if (!st) return;
              const [lng2, lat2] = centroidOf(st);
              globe.pointOfView({ lat: lat2, lng: lng2, altitude: altitudeForFeature(st) * 0.8 }, 900);
              toast(`USA • ${st.properties?.name || st.id}`);
            }
          });
          return;
        }

        // (future) add more overlays here, e.g. England regions by ISO3 GBR + attribute filter
        // if (d.id === 'GBR') { await activateOverlay({ ... }); return; }
      });

    // nice initial POV
    globe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1200);
  }

  // ---------- overlays (universal)
  async function activateOverlay({ name, url, focus, color, stroke, onClick }) {
    $('#mode').textContent = name;
    $('#btnBackWorld').disabled = false;

    try {
      const res = await fetch(url, { headers: { 'Accept': 'application/json' }});
      const gj = await res.json();
      const feats = Array.isArray(gj.features) ? gj.features : [];
      if (!feats.length) throw new Error('No features');

      activeOverlay = { name, data: feats };

      globe
        .polygonsData(feats)
        .polygonCapColor(d => (color ? color(d) : '#f5d67b'))
        .polygonSideColor(() => 'rgba(0,0,0,0.25)')
        .polygonStrokeColor(d => (stroke ? stroke(d) : '#333'))
        .polygonAltitude(d => d.__hover ? 0.06 : 0.012)
        .polygonLabel(d => `<b>${d.properties?.name || d.id}</b>`)
        .onPolygonHover(d => {
          feats.forEach(f => f.__hover = false);
          if (d) d.__hover = true;
        })
        .onPolygonClick(onClick || null);

      // focus where user clicked on world
      if (focus) {
        const [lng, lat] = centroidOf(focus);
        globe.pointOfView({ lat, lng, altitude: Math.max(0.45, altitudeForFeature(focus)) }, 1000);
      }
    } catch (e) {
      toast(`Failed to load overlay: ${name}`);
      // go back to world if overlay fails
      paintWorld(worldFeatures);
    }
  }

  // ---------- UI
  $('#btnBackWorld').addEventListener('click', () => {
    paintWorld(worldFeatures);
    controls.autoRotate = true;
  });
  $('#btnReset').addEventListener('click', () => {
    const pv = activeOverlay
      ? { lat: 37.8, lng: -96, altitude: 0.8 } // pleasant USA view when in overlay
      : { lat: 20, lng: 0, altitude: 2.2 };   // default world view
    globe.pointOfView(pv, 900);
  });

  // ---------- boot
  (async function boot() {
    try {
      const res = await fetch(WORLD_URL, { headers: { 'Accept': 'application/json' }});
      const gj = await res.json();
      worldFeatures = Array.isArray(gj.features) ? gj.features : [];
      if (!worldFeatures.length) throw new Error('No features in world file');
      paintWorld(worldFeatures);
    } catch (e) {
      alert('Could not load world boundaries from ' + WORLD_URL);
      console.error(e);
    }
  })();
  </script>
</body>
</html>
