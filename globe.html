<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Interactive 3D Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; background:#000; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #globeContainer { position: fixed; inset: 0; }
    .hud {
      position: fixed; left: 16px; top: 12px; z-index: 10;
      background: rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.12); border-radius: 10px;
      padding: 8px 10px; backdrop-filter: blur(6px);
      font-size: 13px; line-height: 1.35;
    }
    .hud strong { color:#FFC300; }
    .footer {
      position: fixed; right: 16px; bottom: 12px; z-index: 10;
      background: rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.12); border-radius: 10px;
      padding: 8px 10px; backdrop-filter: blur(6px);
      font-size: 13px;
    }
    .btn { cursor:pointer; padding:6px 10px; border-radius:8px; background:#222; border:1px solid #444; color:#eee; }
    .btn:hover { background:#2e2e2e; }
    .tooltip {
      position: fixed; pointer-events: none; z-index: 20;
      background: rgba(0,0,0,.8); border:1px solid rgba(255,255,255,.2);
      padding: 6px 8px; border-radius: 8px; font-size: 12px;
      transform: translate(-50%, calc(-100% - 10px));
      white-space: nowrap; display:none;
    }
    .error {
      position: fixed; inset: 0; display:flex; align-items:center; justify-content:center; z-index: 30;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.75), rgba(0,0,0,.9));
      color:#ffb4b4; font-size:14px; text-align:center; padding:20px;
    }
  </style>

  <!-- Single CDN (UMD) for Globe.gl; no three.js or textures needed -->
  <script src="https://unpkg.com/globe.gl@4.6.7/dist/globe.gl.min.js"></script>

  <!-- D3 + TopoJSON for projections/parsing -->
  <script src="https://unpkg.com/d3-geo@3"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
</head>
<body>
  <div class="hud">
    <div><strong>Interactive 3D Globe</strong></div>
    <div>Drag to spin • Scroll to zoom • Hover to preview • Click a country to focus</div>
  </div>
  <div class="footer">
    <button id="resetBtn" class="btn">Reset view</button>
    <label style="margin-left:10px;">
      <input id="rotateChk" type="checkbox" checked /> Auto-rotate
    </label>
  </div>

  <div id="globeContainer"></div>
  <div id="tip" class="tooltip"></div>
  <div id="err" class="error" style="display:none;"></div>

  <script>
    const GLEEDS_YELLOW = "#FFC300";
    const NON_GLEEDS_GREY = "#6b6b6b";
    const HOVER_BORDER = "#ffffff";
    const DEFAULT_BORDER = "rgba(0,0,0,0.7)";

    const GLEEDS_COUNTRIES = new Set([
      "GBR","IRL",
      "AUT","CZE","FRA","DEU","HUN","ITA","POL","PRT","ROU","SVK","ESP","UKR",
      "EGY","QAT","SAU","ARE",
      "AUS","CHN","HKG","IND","SGP","VNM",
      "CAN","PER","TTO","USA",
      "BGR","HRV","MNE","SRB","BEL","CHE","LUX","GRC","DNK","FIN","NLD","NOR","SWE",
      "ZAF","LKA","ECU"
    ]);

    const el = document.getElementById('globeContainer');
    const tip = document.getElementById('tip');
    const err = document.getElementById('err');

    // Create globe (no texture → we’ll just use polygon caps as the “look”)
    const world = Globe()
      .backgroundColor("#000000")
      .showAtmosphere(true)
      .atmosphereAltitude(0.12)
      .onGlobeReady(() => {
        world.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1200);
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.4;
      })(el);

    // UI
    document.getElementById('resetBtn').onclick = () =>
      world.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1200);
    document.getElementById('rotateChk').onchange = (e) => {
      world.controls().autoRotate = !!e.target.checked;
    };
    el.addEventListener('mousemove', e => {
      tip.style.left = `${e.clientX}px`;
      tip.style.top = `${e.clientY}px`;
    });

    // Helpers
    function centroidOf(feat) { try { return d3.geoCentroid(feat); } catch { return [0,0]; } }
    function altitudeForFeature(feat) {
      try {
        const [[minLng,minLat],[maxLng,maxLat]] = d3.geoBounds(feat);
        const latSpan = Math.max(0.0001, Math.abs(maxLat-minLat));
        const midLat = (maxLat+minLat)/2;
        const lngSpanRaw = Math.max(0.0001, Math.abs(maxLng-minLng));
        const lngSpan = lngSpanRaw * Math.cos((Math.PI/180) * Math.abs(midLat));
        const span = Math.max(latSpan, lngSpan);
        if (span > 60) return 1.6;
        if (span > 30) return 1.2;
        if (span > 15) return 0.9;
        if (span > 8)  return 0.65;
        if (span > 4)  return 0.5;
        if (span > 2)  return 0.38;
        return 0.28;
      } catch { return 1.0; }
    }

    // Try multiple data sources (first one that succeeds)
    const SOURCES = [
      // 1) jsDelivr TopoJSON (usually fastest)
      { kind: 'topo', url: 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json' },
      // 2) Natural Earth GeoJSON mirror
      { kind: 'geo',  url: 'https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson' },
      // 3) UN simple GeoJSON (coarse but reliable)
      { kind: 'geo',  url: 'https://geojson-maps.ash.ms/world-110m.geo.json' }
    ];

    async function loadCountries() {
      for (const src of SOURCES) {
        try {
          const r = await fetch(src.url, { mode: 'cors' });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
          const data = await r.json();
          if (src.kind === 'topo') {
            const features = topojson.feature(data, data.objects.countries).features;
            features.forEach(f => { f.id = f.id || f.properties?.iso_a3 || f.properties?.iso3 || null; });
            return features;
          } else {
            const features = data.features || [];
            features.forEach(f => { f.id = f.id || f.properties?.iso_a3 || f.properties?.iso3 || null; });
            return features;
          }
        } catch (e) {
          console.warn(`Source failed: ${src.url}`, e);
        }
      }
      throw new Error('All sources failed.');
    }

    loadCountries().then(countries => {
      world
        .polygonsData(countries)
        .polygonCapColor(d => GLEEDS_COUNTRIES.has(d.id) ? GLEEDS_YELLOW : NON_GLEEDS_GREY)
        .polygonSideColor(d => d === world.polygonHoverObject() ? "rgba(255,255,255,0.35)" : "rgba(0,0,0,0.25)")
        .polygonStrokeColor(d => d === world.polygonHoverObject() ? HOVER_BORDER : DEFAULT_BORDER)
        .polygonAltitude(d => d === world.polygonHoverObject() ? 0.06 : 0.01)
        .polygonsTransitionDuration(300)
        .onPolygonHover(d => {
          world.polygonHoverObject(d || null);
          if (d) {
            tip.textContent = d.properties?.name || d.id || "Unknown";
            tip.style.display = "block";
          } else {
            tip.style.display = "none";
          }
        })
        .onPolygonClick(d => {
          if (!d) return;
          const [lng, lat] = centroidOf(d);
          world.pointOfView({ lat, lng, altitude: altitudeForFeature(d) }, 1200);
          world.controls().autoRotate = false;
        });
    }).catch(e => {
      err.style.display = 'flex';
      err.innerHTML = `
        <div>
          <div style="font-weight:700; margin-bottom:6px;">Globe failed to load</div>
          <div>${e.message}</div>
          <div style="margin-top:10px; color:#ddd;">
            If you’re on a corporate network, CDNs like unpkg/jsDelivr may be blocked.<br/>
            We can self-host the library and data files in this repo to avoid that.
          </div>
        </div>`;
      console.error(e);
    });
  </script>
</body>
</html>
