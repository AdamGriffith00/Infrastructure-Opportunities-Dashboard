<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interactive 3D Globe</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }
      #globeViz {
        width: 100%;
        height: 100%;
      }
      #controls {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        display: flex;
        gap: 6px;
      }
      #controls button {
        padding: 6px 10px;
        border: none;
        border-radius: 4px;
        background: #222;
        color: white;
        cursor: pointer;
      }
      #controls button:hover {
        background: #444;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <button onclick="resetView()">Reset View</button>
    </div>
    <div id="globeViz"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three-globe"></script>
    <script src="https://unpkg.com/d3-geo@3"></script>

    <script>
      const GLEEDS_YELLOW = "#FFC300";
      const NON_GLEEDS_GREY = "#555";

      // Gleeds countries ISO codes
      const GLEEDS_SET = new Set([
        "GBR", "IRL",
        "AUT", "CZE", "FRA", "DEU", "HUN", "ITA", "POL", "PRT", "ROU", "SVK", "ESP", "UKR",
        "EGY", "QAT", "SAU", "ARE",
        "AUS", "CHN", "HKG", "IND", "SGP", "VNM",
        "CAN", "PER", "TTO", "USA",
        "BGR", "HRV", "MNE", "SRB", "BEL", "CHE", "LUX", "GRC", "DNK", "FIN", "NLD", "NOR", "SWE",
        "ZAF", "LKA", "ECU"
      ]);

      const WORLD_GEO = "/assets/world-110m.geo.json"; // <--- Your saved file

      const worldGlobe = Globe()
        .globeImageUrl("//unpkg.com/three-globe/example/img/earth-dark.jpg")
        .backgroundImageUrl("//unpkg.com/three-globe/example/img/night-sky.png")
        .polygonAltitude(0.006)
        .polygonCapColor(f =>
          GLEEDS_SET.has(f.id) ? GLEEDS_YELLOW : NON_GLEEDS_GREY
        )
        .polygonSideColor(() => "rgba(0,0,0,0.35)")
        .polygonStrokeColor(() => "rgba(220,220,220,0.9)")
        .polygonLabel(f => `${f.properties?.name || f.id}`);

      async function init() {
        try {
          const res = await fetch(WORLD_GEO);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          if (data.type === "FeatureCollection") {
            data.features.forEach(f => {
              const iso =
                f.id ||
                f.properties?.ISO_A3 ||
                f.properties?.iso_a3 ||
                f.properties?.ADM0_A3;
              if (iso) f.id = iso;
            });

            worldGlobe.polygonsData(data.features);
          } else {
            alert("Unsupported world file format");
          }
        } catch (err) {
          console.error(err);
          alert("Failed to load world boundaries. Check path/format.");
        }
      }

      function resetView() {
        worldGlobe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1000);
      }

      init();
      document.getElementById("globeViz").appendChild(worldGlobe());
    </script>
  </body>
</html>
