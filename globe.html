<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Interactive 3D Globe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; background:#000; color:#ddd; font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif }
    #scene { position:fixed; inset:0; }
    .hud { position:fixed; top:10px; left:10px; z-index:10; display:flex; gap:.5rem; }
    .hud button { background:#222; color:#ddd; border:1px solid #444; padding:.45rem .7rem; border-radius:8px; cursor:pointer }
    .hud button:hover { background:#2d2d2d }
    .log { position:fixed; top:10px; right:10px; z-index:10; font:12px/1.4 monospace; color:#9fe89f; text-align:right; white-space:pre; }
    .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; background:#111; color:#e6c300; border:1px solid #3b3000; padding:.4rem .6rem; border-radius:8px; opacity:.85 }
  </style>

  <!-- Local vendor scripts (classic, non-module) -->
  <script src="/assets/vendor/three.min.js"></script>
  <script src="/assets/vendor/OrbitControls.js"></script>
  <script src="/assets/vendor/d3-geo.v1.min.js"></script>
  <script src="/assets/vendor/three-globe.min.js"></script>
</head>
<body>
  <div class="hud">
    <button id="btnWorld">Back to World</button>
    <button id="btnReset">Reset View</button>
  </div>
  <div class="log" id="log">loading…</div>
  <div id="scene"></div>
  <div class="toast">Drag to spin • Scroll to zoom • Click a country</div>

  <script>
    // ------- tiny logger (visible without DevTools)
    const logEl = document.getElementById('log');
    const log = (msg) => { logEl.textContent = msg + "\n" + logEl.textContent.slice(0, 1600); };

    // ------- constants / colours
    const WORLD_GEOJSON_URL = '/assets/world-110m.geojson'; // <— LOCAL file
    const GLEEDS_YELLOW = 0xFFC300;
    const GREY          = 0x666666;
    const EDGE_DEFAULT  = 0x111111;
    const EDGE_HOVER    = 0xffffff;

    // Countries to highlight (ISO_A3 in the world-110m file)
    const GLEEDS = new Set([
      'GBR','IRL','AUT','CZE','FRA','DEU','HUN','ITA','POL','PRT','ROU','SVK','ESP','UKR',
      'EGY','QAT','SAU','ARE','AUS','CHN','HKG','IND','SGP','VNM','CAN','PER','TTO','USA',
      'BGR','HRV','MNE','SRB','BEL','CHE','LUX','GRC','DNK','FIN','NLD','NOR','SWE','ZAF','LKA','ECU'
    ]);

    // ------- THREE/scene boot
    const W = window.innerWidth, H = window.innerHeight;
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    document.getElementById('scene').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 2000);
    camera.position.z = 380;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed   = 0.7;
    controls.minDistance   = 160;
    controls.maxDistance   = 800;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(-200, 200, 200);
    scene.add(dir);

    // Globe with a simple material (no external textures needed)
    const globe = new ThreeGlobe()
      .globeMaterial(new THREE.MeshPhongMaterial({
        color: 0x0b0b0b, emissive: 0x0a1624, shininess: 6
      }))
      .showAtmosphere(true)
      .atmosphereColor('#93c2ff')
      .atmosphereAltitude(0.18);

    scene.add(globe);

    // ------- helpers
    function centroidOf(feat) {
      try { return d3.geoCentroid(feat); } catch { return [0,0]; }
    }
    function altitudeForFeature(feat) {
      try {
        const [[minLng, minLat], [maxLng, maxLat]] = d3.geoBounds(feat);
        const latSpan = Math.abs(maxLat - minLat);
        const midLat  = (maxLat + minLat)/2;
        const lngSpan = Math.abs(maxLng - minLng) * Math.cos(Math.abs(midLat) * Math.PI/180);
        const span = Math.max(latSpan, lngSpan);
        if (span > 60) return 1.6;
        if (span > 30) return 1.2;
        if (span > 15) return 0.9;
        if (span >  8) return 0.65;
        if (span >  4) return 0.5;
        if (span >  2) return 0.38;
        return 0.28;
      } catch { return 1.1; }
    }

    // ------- load world polygons (LOCAL)
    fetch(WORLD_GEOJSON_URL, { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
      .then(gj => {
        const feats = Array.isArray(gj.features) ? gj.features : [];
        if (!feats.length) throw new Error('GeoJSON has no features');

        globe
          .polygonsData(feats)
          .polygonCapColor(f => GLEEDS.has(f.id) ? '#FFC300' : '#666666')
          .polygonSideColor(() => 'rgba(0,0,0,0.25)')
          .polygonStrokeColor(f => f.__hover ? '#ffffff' : '#111111')
          .polygonAltitude(f => f.__hover ? 0.06 : (GLEEDS.has(f.id) ? 0.02 : 0.012))
          .polygonsTransitionDuration(200)
          .onPolygonHover(f => {
            (globe.polygonsData() || []).forEach(d => d.__hover = (d === f));
          })
          .onPolygonClick(f => {
            const [lng, lat] = centroidOf(f);
            const alt = altitudeForFeature(f);
            globe.pointOfView({ lat, lng, altitude: alt }, 1200);
          });

        // start position
        globe.pointOfView({ lat: 20, lng: 0, altitude: 2.3 }, 1200);
        log('world loaded: ' + feats.length + ' features');
      })
      .catch(err => {
        log('ERROR loading world: ' + err.message);
        alert('Could not load world boundaries from ' + WORLD_GEOJSON_URL);
      });

    // ------- controls
    document.getElementById('btnReset').onclick = () => {
      globe.pointOfView({ lat: 20, lng: 0, altitude: 2.3 }, 1000);
    };
    document.getElementById('btnWorld').onclick = () => {
      globe.pointOfView({ lat: 20, lng: 0, altitude: 2.3 }, 1000);
    };

    // ------- render loop + resize
    (function animate(){
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    })();
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w/h; camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
