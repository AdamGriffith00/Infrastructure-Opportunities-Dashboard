<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive 3D Globe</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; }
    #globeViz { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #buttons { position: absolute; top: 10px; left: 10px; z-index: 10; }
    button { margin: 5px; padding: 5px 10px; border: none; border-radius: 4px; }
    #diag { position: absolute; top: 10px; right: 10px; color: lime; font-size: 12px; background: rgba(0,0,0,0.7); padding: 5px; }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <div id="buttons">
    <button onclick="resetView()">Reset View</button>
    <button id="backBtn" onclick="backToWorld()" style="display:none;">Back to World</button>
  </div>
  <div id="diag">loading…</div>

  <!-- Local vendor libs -->
  <script src="/assets/vendor/three.min.js"></script>
  <script src="/assets/vendor/OrbitControls.js"></script>
  <script src="/assets/vendor/d3-geo.v1.min.js"></script>
  <script src="/assets/vendor/three-globe.min.js"></script>

  <script>
    // --- Error overlay ---
    window.addEventListener('error', (e) => {
      const el = document.getElementById('diag');
      if (el) el.textContent = 'ERROR: ' + (e?.message || String(e));
    });

    const globeContainer = document.getElementById('globeViz');
    const Globe = new ThreeGlobe();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    globeContainer.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera();
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    camera.position.z = 300;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = true;

    scene.add(new THREE.AmbientLight(0xbbbbbb));
    scene.add(new THREE.DirectionalLight(0xffffff, 0.6));

    scene.add(Globe);

    // --- API compatibility shim ---
    function bindHandler(obj, key, fn) {
      if (typeof obj[key] === 'function') {
        obj[key](fn);  // new API
      } else {
        obj[key] = fn; // old API
      }
    }

    // --- Load world map ---
    fetch('/assets/world-110m.geojson')
      .then(res => res.json())
      .then(worldData => {
        Globe
          .polygonsData(worldData.features)
          .polygonCapColor(feat => 'rgba(200,200,200,0.8)')
          .polygonSideColor(() => 'rgba(0,100,0,0.3)')
          .polygonStrokeColor(() => '#111')
          .polygonLabel(({ properties: d }) => d.name);

        // hover highlight
        let hovered;
        bindHandler(Globe, 'onPolygonHover', feat => { hovered = feat; });
        Globe.polygonCapColor(feat =>
          feat === hovered ? 'orange' : 'rgba(200,200,200,0.8)'
        );

        // click focus
        bindHandler(Globe, 'onPolygonClick', feat => {
          if (feat && feat.properties.name === 'United States of America') {
            loadUSAOverlay();
          }
        });

        document.getElementById('diag').textContent = 'ready';
        animate();
      })
      .catch(err => {
        document.getElementById('diag').textContent = 'ERROR loading world geojson';
        console.error(err);
        alert('Could not load world boundaries from /assets/world-110m.geojson');
      });

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    // --- Buttons ---
    function resetView() {
      camera.position.set(0, 0, 300);
      controls.update();
    }

    function backToWorld() {
      fetch('/assets/world-110m.geojson')
        .then(res => res.json())
        .then(worldData => {
          Globe.polygonsData(worldData.features);
          document.getElementById('backBtn').style.display = 'none';
        });
    }

    // --- USA overlay ---
    function loadUSAOverlay() {
      fetch('/assets/overlays/usa-states.geojson')
        .then(res => res.json())
        .then(usaData => {
          Globe.polygonsData(usaData.features)
            .polygonCapColor(() => 'rgba(0,150,255,0.7)')
            .polygonSideColor(() => 'rgba(0,100,200,0.3)')
            .polygonStrokeColor(() => '#111')
            .polygonLabel(({ properties: d }) => d.name);
          document.getElementById('backBtn').style.display = 'inline-block';
        })
        .catch(err => {
          document.getElementById('diag').textContent = 'ERROR loading USA overlay';
          console.error(err);
        });
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
