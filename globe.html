<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Interactive 3D Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; background:#000; color:#ddd; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #toolbar {
      position: fixed; top: 10px; left: 10px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap;
      background: rgba(0,0,0,.35); padding: 8px; border-radius: 10px; backdrop-filter: blur(6px);
    }
    .btn { cursor: pointer; border: 0; padding: 7px 10px; border-radius: 8px; font-weight: 600; }
    .btn:disabled { opacity:.5; cursor: not-allowed; }
    .btn-ghost { background:#222; color:#ddd; }
    .btn-yellow { background:#FFC300; color:#111; }
    #hint {
      position: fixed; left: 12px; bottom: 10px; color:#aaa; font-size: 12px; opacity:.9; z-index: 5;
      background:rgba(0,0,0,.35); padding: 6px 8px; border-radius: 8px; backdrop-filter: blur(6px);
    }
    #globe { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-legend" class="btn btn-yellow" title="Gleeds countries are highlighted">Gleeds Countries</button>
    <button id="btn-world"  class="btn btn-ghost">Back to World</button>
    <button id="btn-usa"    class="btn btn-ghost" style="display:none;">Back to USA</button>
    <button id="btn-reset"  class="btn btn-ghost">Reset View</button>
  </div>
  <div id="hint">Drag to spin • Scroll to zoom • Click a <b>yellow</b> country • Click a state when USA is active</div>
  <div id="globe"></div>

  <!-- Load LOCAL vendor scripts in the correct order (UMD builds, no modules) -->
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/OrbitControls.js"></script>
  <script src="assets/vendor/d3-geo.v1.min.js"></script>
  <script src="assets/vendor/three-globe.min.js"></script>

  <script>
  (async function () {
    // ----------- Config / constants
    const GLEEDS_YELLOW = '#FFC300';
    const NON_GLEEDS_GREY = '#6b6b6b';
    const HOVER_STROKE = '#ffffff';
    const DEFAULT_STROKE = 'rgba(0,0,0,.7)';

    // Countries Gleeds operates in (ISO_A3)
    const GLEEDS = new Set([
      'GBR','IRL',
      'AUT','CZE','FRA','DEU','HUN','ITA','POL','PRT','ROU','SVK','ESP','UKR',
      'EGY','QAT','SAU','ARE',
      'AUS','CHN','HKG','IND','SGP','VNM',
      'CAN','PER','TTO','USA',
      'BGR','HRV','MNE','SRB','BEL','CHE','LUX','GRC','DNK','FIN','NLD','NOR','SWE',
      'ZAF','LKA','ECU'
    ]);

    // Data sources (local files)
    const WORLD_URL = 'assets/world-110m.geojson';
    const US_STATES_URL = 'assets/overlays/us-states.geojson';

    // ----------- three.js scene scaffold
    const width  = window.innerWidth;
    const height = window.innerHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(width, height);
    document.getElementById('globe').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, width/height, 0.1, 1000);
    camera.position.z = 350;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.6;
    controls.minDistance = 120;
    controls.maxDistance = 700;

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const dir = new THREE.DirectionalLight(0xffffff, 0.6);
    dir.position.set(-400, 100, 400);
    scene.add(dir);

    // Stars background
    const starGeo = new THREE.SphereGeometry(900, 32, 32);
    const starMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
    scene.add(new THREE.Mesh(starGeo, starMat));

    // Globe
    const globe = new ThreeGlobe()
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .showAtmosphere(true)
      .atmosphereAltitude(0.22);

    scene.add(globe);

    // ----------- helpers
    const $btnWorld = document.getElementById('btn-world');
    const $btnUSA   = document.getElementById('btn-usa');
    const $btnReset = document.getElementById('btn-reset');

    let worldFeatures = [];
    let usStateFeatures = [];
    let mode = 'world'; // 'world' | 'usa-states'
    let hovered = null;

    function fitToFeature(feat) {
      // Compute a sensible altitude based on feature bounds
      try {
        const b = d3.geoBounds(feat);
        const [[minLng, minLat], [maxLng, maxLat]] = b;
        const latSpan = Math.max(0.0001, Math.abs(maxLat - minLat));
        const midLat = (maxLat + minLat) / 2;
        const lngSpanRaw = Math.max(0.0001, Math.abs(maxLng - minLng));
        const lngSpan = lngSpanRaw * Math.cos(Math.abs(midLat) * Math.PI/180);
        const span = Math.max(latSpan, lngSpan);

        // Compute centroid
        const [lng, lat] = d3.geoCentroid(feat);
        let altitude;
        if (span > 60) altitude = 1.6;
        else if (span > 30) altitude = 1.2;
        else if (span > 15) altitude = 0.9;
        else if (span > 8)  altitude = 0.65;
        else if (span > 4)  altitude = 0.5;
        else if (span > 2)  altitude = 0.38;
        else altitude = 0.28;

        globe.pointOfView({ lat, lng, altitude }, 1200);
      } catch (e) {
        console.warn('fitToFeature failed', e);
      }
    }

    function setWorldPolygons() {
      mode = 'world';
      $btnUSA.style.display = 'none';
      globe
        .polygonsData(worldFeatures)
        .polygonCapColor(d => GLEEDS.has(d.id) ? GLEEDS_YELLOW : NON_GLEEDS_GREY)
        .polygonSideColor(d => d === hovered ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.2)')
        .polygonStrokeColor(d => d === hovered ? HOVER_STROKE : DEFAULT_STROKE)
        .polygonAltitude(d => d === hovered ? 0.06 : 0.01)
        .polygonsTransitionDuration(300)
        .onPolygonHover(feat => { hovered = feat; })
        .onPolygonClick(async feat => {
          if (!feat) return;
          if (feat.id === 'USA') {
            await ensureUSStates();
            setUSStatesPolygons(feat);
          } else if (GLEEDS.has(feat.id)) {
            fitToFeature(feat);
          }
        });

      // Nice default view
      globe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1200);
    }

    function setUSStatesPolygons(usaFeat) {
      mode = 'usa-states';
      $btnUSA.style.display = ''; // show
      globe
        .polygonsData(usStateFeatures)
        .polygonCapColor(() => GLEEDS_YELLOW)
        .polygonSideColor(d => d === hovered ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.25)')
        .polygonStrokeColor(d => d === hovered ? HOVER_STROKE : DEFAULT_STROKE)
        .polygonAltitude(d => d === hovered ? 0.06 : 0.01)
        .polygonsTransitionDuration(300)
        .onPolygonHover(feat => { hovered = feat; })
        .onPolygonClick(stateFeat => {
          if (!stateFeat) return;
          fitToFeature(stateFeat);
        });

      // zoom to USA footprint
      fitToFeature(usaFeat);
    }

    async function ensureUSStates() {
      if (usStateFeatures.length) return;
      try {
        const res = await fetch(US_STATES_URL);
        const gj = await res.json();
        usStateFeatures = gj.features || [];
      } catch (e) {
        console.error('Failed to load US states overlay', e);
        alert('Could not load US states overlay.');
      }
    }

    // ----------- load & init world
    try {
      const res = await fetch(WORLD_URL);
      const world = await res.json();
      worldFeatures = world.features || [];
    } catch (e) {
      console.error('Failed to load world GeoJSON', e);
      alert('Could not load world boundaries.');
      return;
    }

    setWorldPolygons();

    // ----------- Controls
    $btnWorld.addEventListener('click', () => {
      setWorldPolygons();
    });

    $btnUSA.addEventListener('click', async () => {
      // If we’re already in states view, re-fit to USA bounds
      const usa = worldFeatures.find(f => f.id === 'USA');
      if (!usa) return;
      if (mode !== 'usa-states') {
        await ensureUSStates();
        setUSStatesPolygons(usa);
      } else {
        fitToFeature(usa);
      }
    });

    $btnReset.addEventListener('click', () => {
      // Reset camera and whichever layer is active
      globe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 900);
    });

    // ----------- Render loop
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();

    // Resize
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w/h;
      camera.updateProjectionMatrix();
    });

    console.log('Globe ready: THREE', !!THREE, 'ThreeGlobe', !!ThreeGlobe);
  })();
  </script>
</body>
</html>
