<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Interactive 3D Globe · Gleeds</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; background:#000; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #topbar { position:fixed; inset:0 0 auto 0; height:44px; display:flex; align-items:center; gap:12px;
              padding:8px 12px; background:rgba(0,0,0,.45); backdrop-filter:saturate(1.2) blur(6px); border-bottom:1px solid rgba(255,255,255,.08); z-index:10; }
    #hud    { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:9;
              background:rgba(255,255,255,.08); padding:8px 12px; border-radius:12px; backdrop-filter:blur(6px); font-size:14px; }
    #legend { position:fixed; right:14px; bottom:18px; font-size:12px; color:#ddd }
    #legend span{ display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:-1px; border-radius:2px }
    #stage  { position:absolute; inset:44px 0 0 0; }
    #tooltip{ position:fixed; z-index:20; width:320px; pointer-events:none; background:rgba(0,0,0,.78);
              border:1px solid rgba(255,255,255,.2); border-radius:14px; padding:12px; box-shadow:0 10px 24px rgba(0,0,0,.45); display:none; }
    #diag   { position:fixed; right:10px; top:10px; font:12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:#9f9;
              background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.15); padding:6px 8px; border-radius:8px; white-space:pre; z-index:15; }
    button, input[type="checkbox"] { cursor:pointer; }
    .btn { border:1px solid rgba(255,255,255,.25); background:transparent; color:#fff; padding:6px 10px; border-radius:8px; }
    .muted { color: #bbb }
  </style>
  <!-- Local vendor scripts (no modules) -->
  <script src="/assets/vendor/three.min.js"></script>
  <script src="/assets/vendor/OrbitControls.js"></script>
  <script src="/assets/vendor/d3-geo.v1.min.js"></script>
  <script src="/assets/vendor/three-globe.min.js"></script>
</head>
<body>
  <div id="topbar">
    <strong>Interactive 3D Globe</strong>
    <label style="margin-left:auto; font-size:13px;">
      <input id="autoRotate" type="checkbox" checked /> Auto-rotate
    </label>
    <button id="resetBtn" class="btn">Reset view</button>
  </div>

  <div id="hud" class="muted">Drag to spin • Scroll to zoom • Hover to highlight • Click a country</div>

  <div id="legend">
    <div><span style="background:#FFC300"></span> Gleeds presence</div>
    <div><span style="background:#555"></span> Other countries</div>
  </div>

  <div id="stage"></div>
  <div id="tooltip"></div>
  <div id="diag">loading…</div>

  <script>
    (function () {
      const DIAG = document.getElementById('diag');
      const stage = document.getElementById('stage');
      const tooltip = document.getElementById('tooltip');

      function log(line) {
        DIAG.textContent += (DIAG.textContent ? "\n" : "") + line;
      }
      DIAG.textContent = "Starting…";

      // Quick WebGL sanity check
      try {
        const c = document.createElement('canvas');
        if (!(c.getContext('webgl') || c.getContext('experimental-webgl'))) {
          DIAG.textContent = "WebGL not available on this device/browser.";
          return;
        }
      } catch (e) {
        DIAG.textContent = "WebGL init failed.";
        return;
      }

      // ---- constants / styling
      const WORLD_URL = "/assets/world-110m.geojson";
      const GLOBE_IMG = "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg";
      const BUMP_IMG  = "https://unpkg.com/three-globe/example/img/earth-topology.png";

      const GLEEDS_YELLOW   = "#FFC300";
      const NON_GLEEDS_GREY = "#555555";
      const HOVER_BORDER    = "#FFFFFF";
      const DEFAULT_BORDER  = "rgba(0,0,0,0.7)";

      const GLEEDS = new Set([
        "GBR","IRL",
        "AUT","CZE","FRA","DEU","HUN","ITA","POL","PRT","ROU","SVK","ESP","UKR",
        "EGY","QAT","SAU","ARE",
        "AUS","CHN","HKG","IND","SGP","VNM",
        "CAN","PER","TTO","USA",
        "BGR","HRV","MNE","SRB","BEL","CHE","LUX","GRC","DNK","FIN","NLD","NOR","SWE",
        "ZAF","LKA","ECU"
      ]);

      function displayName(f) {
        if (!f) return "";
        if (f.id === "GBR") return "United Kingdom";
        const n = (f.properties && f.properties.name) || f.id;
        return n === "French Guiana" ? "French Guiana (France)" : n;
      }

      function centroidOf(feature) {
        try { return d3.geoCentroid(feature); } catch { return [0, 0]; }
      }
      function altitudeForFeature(feat) {
        try {
          const [[minLng, minLat],[maxLng,maxLat]] = d3.geoBounds(feat);
          const latSpan = Math.max(0.0001, Math.abs(maxLat - minLat));
          const midLat  = (maxLat + minLat) / 2;
          const lngSpan = Math.max(0.0001, Math.abs(maxLng - minLng)) * Math.cos(Math.abs(midLat)*Math.PI/180);
          const span = Math.max(latSpan, lngSpan);
          if (span > 60) return 1.6;
          if (span > 30) return 1.2;
          if (span > 15) return 0.9;
          if (span > 8)  return 0.65;
          if (span > 4)  return 0.5;
          if (span > 2)  return 0.38;
          return 0.28;
        } catch { return 1.0; }
      }

      // -------- budgets (preview) --------
      const GBP = new Intl.NumberFormat("en-GB", { style:"currency", currency:"GBP", maximumFractionDigits:0 });
      function demoBudgets(id="") {
        const a = id.charCodeAt(0) || 83, b = id.charCodeAt(1) || 19;
        const base = (a*31 + b*17) % 220;
        const y1  = 12 + base;
        const y5  = Math.round(y1 * 5 * (0.98 + (base % 7) / 50));
        const y10 = Math.round(y1 * 10 * (0.95 + (base % 9) / 40));
        return { y1, y5, y10 };
      }
      const BUDGETS = {
        GBR:{name:"United Kingdom", y1:131000, y5:265000, y10:725000, basis:"Strategy/Pipeline (preview)"},
        USA:{name:"United States",  y1:195000, y5:936000, y10:1900000, basis:"IIJA/BIL preview; USD->GBP~0.78"},
        FRA:{name:"France",         y1:11500,  y5:57500,  y10:115000,  basis:"Rail+grid preview; EUR->GBP~0.85"},
        DEU:{name:"Germany",        y1:45000,  y5:225000, y10:450000,  basis:"BVWP preview; EUR->GBP~0.85"}
        // (you can keep adding your full list later)
      };
      function getBudgets(iso) {
        const key = iso && iso.toUpperCase ? iso.toUpperCase() : iso;
        return BUDGETS[key] || demoBudgets(key || "");
      }

      // -------- init three-globe --------
      const width  = () => stage.clientWidth;
      const height = () => stage.clientHeight;

      const renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setSize(width(), height());
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      stage.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.add(new THREE.AmbientLight(0xbbbbbb, 0.7));
      const dLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dLight.position.set(1,1,1);
      scene.add(dLight);

      const camera = new THREE.PerspectiveCamera();
      camera.aspect = width()/height();
      camera.updateProjectionMatrix();
      camera.position.z = 400;

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.minDistance = 140;
      controls.maxDistance = 700;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.4;

      const globe = new ThreeGlobe()
        .globeImageUrl(GLOBE_IMG)
        .bumpImageUrl(BUMP_IMG)
        .showAtmosphere(true)
        .atmosphereAltitude(0.12);

      scene.add(globe);

      window.addEventListener('resize', () => {
        renderer.setSize(width(), height());
        camera.aspect = width()/height();
        camera.updateProjectionMatrix();
      });

      // HUD controls
      document.getElementById('autoRotate').addEventListener('change', (e) => {
        controls.autoRotate = !!e.target.checked;
      });
      document.getElementById('resetBtn').addEventListener('click', () => {
        activeCountry = null;
        document.getElementById('hud').textContent =
          "Drag to spin • Scroll to zoom • Hover to highlight • Click a country";
        globe.pointOfView({ lat:20, lng:0, altitude:2.2 }, 1000);
      });

      let hovered = null;
      let activeCountry = null;

      function animate() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();

      // --- tooltip follow mouse
      window.addEventListener('mousemove', (e) => {
        if (!tooltip.dataset.show) return;
        const maxX = (window.innerWidth  || 1200) - 340;
        const maxY = (window.innerHeight || 800)  - 180;
        tooltip.style.left = Math.min(e.clientX + 16, maxX) + "px";
        tooltip.style.top  = Math.min(e.clientY + 16, maxY) + "px";
      }, { passive:true });

      // ---- load world and wire events
      fetch(WORLD_URL, { cache:"force-cache" })
        .then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          log("World GeoJSON OK @ " + WORLD_URL);
          return r.json();
        })
        .then(gj => {
          const feats = (gj.features || []).map(f => {
            const iso = f.properties?.iso_a3 || f.properties?.ISO_A3 || f.id || f.properties?.name;
            return Object.assign({}, f, { id: iso });
          });

          globe
            .polygonsData(feats)
            .polygonCapColor(d => (GLEEDS.has(d.id) && d.properties?.name !== "French Guiana") ? GLEEDS_YELLOW : NON_GLEEDS_GREY)
            .polygonSideColor(d => d === hovered ? "rgba(255,255,255,0.4)" : "rgba(0,0,0,0.2)")
            .polygonStrokeColor(d => d === hovered ? HOVER_BORDER : DEFAULT_BORDER)
            .polygonAltitude(d => d === hovered ? 0.06 : 0.01)
            .polygonsTransitionDuration(300)
            .polygonLabel(d => `<b>${displayName(d)}</b>`);

          globe.onPolygonHover(d => {
            hovered = d || null;
            globe
              .polygonSideColor(x => x === hovered ? "rgba(255,255,255,0.4)" : "rgba(0,0,0,0.2)")
              .polygonStrokeColor(x => x === hovered ? HOVER_BORDER : DEFAULT_BORDER)
              .polygonAltitude(x => x === hovered ? 0.06 : 0.01);
            // tooltip for Gleeds countries
            if (hovered && GLEEDS.has(hovered.id)) {
              const b = getBudgets(hovered.id);
              const override = BUDGETS[hovered.id];
              tooltip.innerHTML = `
                <div style="font-size:12px; color:#aaa; text-transform:uppercase; letter-spacing:.03em">Budget projection (preview)</div>
                <div style="font-weight:600; margin-top:2px">${displayName(hovered)}</div>
                <div style="font-size:14px; margin-top:6px">
                  <div style="display:flex; justify-content:space-between"><span>1 year</span><span>${GBP.format(b.y1*1_000_000)}</span></div>
                  <div style="display:flex; justify-content:space-between"><span>5 years</span><span>${GBP.format(b.y5*1_000_000)}</span></div>
                  <div style="display:flex; justify-content:space-between"><span>10 years</span><span>${GBP.format(b.y10*1_000_000)}</span></div>
                </div>
                ${override?.basis ? `<div style="margin-top:6px; color:#bbb; font-size:11px">${override.basis}</div>` : ""}`;
              tooltip.style.display = "block";
              tooltip.dataset.show = "1";
            } else {
              tooltip.style.display = "none";
              delete tooltip.dataset.show;
            }
          });

          globe.onPolygonClick(f => {
            if (!f) return;
            activeCountry = f;
            document.getElementById('hud').textContent = displayName(f);
            const [lng, lat] = centroidOf(f);
            const alt = altitudeForFeature(f);
            controls.autoRotate = false;
            globe.pointOfView({ lat, lng, altitude: alt }, 1200);
          });

          // initial camera
          globe.pointOfView({ lat:20, lng:0, altitude:2.2 }, 800);
          DIAG.textContent = "ready";
        })
        .catch(err => {
          console.error(err);
          DIAG.textContent = `Could not load world boundaries from ${WORLD_URL}`;
          alert(`growth-portal-shell.netlify.app says\n\nCould not load world boundaries from ${WORLD_URL}`);
        });
    })();
  </script>
</body>
</html>
