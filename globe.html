<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive 3D Globe</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
    #globeViz { width: 100vw; height: 100vh; }
    .topbar {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      display: flex; gap: 10px;
    }
    button {
      background: #222; color: white; border: 1px solid #555;
      padding: 5px 10px; border-radius: 5px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button onclick="resetView()">Reset View</button>
  </div>
  <div id="globeViz"></div>

  <!-- Local vendor scripts -->
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/OrbitControls.js"></script>
  <script src="assets/vendor/d3-geo.v1.min.js"></script>
  <script src="assets/vendor/three-globe.min.js"></script>

  <script>
    console.log("Starting globe…");

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById("globeViz").appendChild(renderer.domElement);

    // Scene + Camera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 300;

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = true;

    // Globe
    const globe = new ThreeGlobe()
      .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-dark.jpg")
      .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png");

    scene.add(globe);

    // Lighting
    const light = new THREE.AmbientLight(0xbbbbbb);
    scene.add(light);
    const directional = new THREE.DirectionalLight(0xffffff, 0.6);
    directional.position.set(1, 1, 1);
    scene.add(directional);

    // Load world polygons
    fetch("assets/world-110m.geojson")
      .then(res => res.json())
      .then(countries => {
        globe
          .polygonsData(countries.features)
          .polygonCapColor(() => "rgba(200,200,200,0.8)")
          .polygonSideColor(() => "rgba(50,50,50,0.5)")
          .polygonStrokeColor(() => "#111");
      });

    // Animate loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Reset camera
    function resetView() {
      camera.position.z = 300;
      controls.update();
    }

    console.log("Globe loaded OK");
  </script>
</body>
</html>
