<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive 3D Globe</title>

  <style>
    html, body { margin:0; height:100%; background:#000; color:#ddd; font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #ui {
      position: fixed; top:10px; left:10px; z-index: 10; display:flex; gap:.5rem; align-items:center;
      background: rgba(0,0,0,.35); backdrop-filter: blur(6px); padding:6px 8px; border-radius:10px; border:1px solid rgba(255,255,255,.08);
    }
    .btn {
      appearance:none; border:1px solid rgba(255,255,255,.12); background:#161616; color:#eee;
      padding:6px 10px; border-radius:9px; cursor:pointer; font-size:.9rem;
    }
    .btn:hover { background:#1d1d1d; }
    .btn[disabled] { opacity:.4; cursor:not-allowed; }
    #hint {
      position: fixed; left:12px; bottom:10px; color:#aaa; font-size:.8rem; opacity:.8;
      background: rgba(0,0,0,.35); padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.08);
    }
    canvas { display:block; }
  </style>

  <!-- Local vendor scripts (UMD / non-module) -->
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/OrbitControls.js"></script>
  <script src="assets/vendor/d3-geo.v1.min.js"></script>
  <script src="assets/vendor/three-globe.min.js"></script>
</head>
<body>
  <div id="ui">
    <button class="btn" id="btnBackWorld">Back to World</button>
    <button class="btn" id="btnHideStates" style="display:none;">Hide States</button>
    <button class="btn" id="btnReset">Reset View</button>
  </div>
  <div id="hint">Drag to spin • Scroll to zoom • Click a yellow country • Click a state when USA is active</div>
  <div id="container"></div>

  <script>
  (function () {
    // --- Gleeds brand + countries ---
    const GLEEDS_YELLOW = '#FFC300';
    const GLEEDS_COUNTRIES = new Set([
      'GBR','IRL',
      'AUT','CZE','FRA','DEU','HUN','ITA','POL','PRT','ROU','SVK','ESP','UKR',
      'EGY','QAT','SAU','ARE',
      'AUS','CHN','HKG','IND','SGP','VNM',
      'CAN','PER','TTO','USA',
      'BGR','HRV','MNE','SRB','BEL','CHE','LUX','GRC','DNK','FIN','NLD','NOR','SWE',
      'ZAF','LKA','ECU'
    ]);

    // --- Three scene ---
    const el = document.getElementById('container');
    const scene = new THREE.Scene();

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    el.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 20000);
    camera.position.z = 500;

    // lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(200, 200, 200);
    scene.add(dir);

    // controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 120;
    controls.maxDistance = 1200;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;

    // Globe (base)
    const globe = new ThreeGlobe()
      .globeImageUrl('assets/earth-blue-marble.jpg') /* optional; drop file if you have one */
      .bumpImageUrl('assets/earth-topology.png')     /* optional; drop file if you have one */
      .showAtmosphere(true)
      .atmosphereAltitude(0.18)
      .atmosphereColor('#9ecbff');

    scene.add(globe);

    // Keep a ref to the USA states overlay
    let statesLayer = null;

    // Initial POV
    function viewHome() {
      controls.autoRotate = true;
      globe.pointOfView({ lat: 20, lng: 0, altitude: 300 }, 1000);
    }
    viewHome();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();

    // --- Helper: zoom to a feature centroid ---
    function zoomToFeature(feat, fixedAlt) {
      if (!feat) return;
      const c = d3.geoCentroid(feat); // [lng, lat]
      // A simple size-based altitude (smaller feature -> closer)
      let alt = 170;
      try {
        const b = d3.geoBounds(feat);
        const span = Math.max(Math.abs(b[1][0] - b[0][0]), Math.abs(b[1][1] - b[0][1]));
        alt = span > 60 ? 240 : span > 30 ? 210 : span > 15 ? 180 : span > 8 ? 150 : 120;
      } catch {}
      globe.pointOfView({ lat: c[1], lng: c[0], altitude: fixedAlt || alt }, 900);
      controls.autoRotate = false;
    }

    // --- Helper: load USA states overlay (once) ---
    function loadUSAStatesOverlay() {
      if (statesLayer) return; // already loaded
      fetch('assets/overlays/usa-states.geojson')
        .then(r => r.json())
        .then(states => {
          statesLayer = new ThreeGlobe()
            .polygonsData(states.features)
            .polygonCapColor(() => 'rgba(255,195,0,0.35)') // semi Gleeds yellow
            .polygonSideColor(() => 'rgba(60,60,60,0.45)')
            .polygonStrokeColor(() => '#333')
            .polygonAltitude(() => 0.012)
            .polygonsTransitionDuration(220);

          scene.add(statesLayer);

          // click a state to zoom tighter
          statesLayer.onPolygonClick(f => zoomToFeature(f, 120));

          // expose "Hide States" button
          document.getElementById('btnHideStates').style.display = 'inline-block';
        })
        .catch(err => {
          alert('Could not load USA states overlay: ' + err);
        });
    }

    function clearUSAStates() {
      if (statesLayer) {
        scene.remove(statesLayer);
        statesLayer = null;
      }
      document.getElementById('btnHideStates').style.display = 'none';
    }

    // --- Load world polygons + wire up interactions ---
    fetch('assets/world-110m.geojson')
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(gj => {
        const feats = gj.features || [];
        globe
          .polygonsData(feats)
          .polygonCapColor(d => GLEEDS_COUNTRIES.has(d.id) ? GLEEDS_YELLOW : 'rgba(200,200,200,0.85)')
          .polygonSideColor(() => 'rgba(40,40,40,0.6)')
          .polygonStrokeColor(() => '#101010')
          .polygonsTransitionDuration(250)
          .polygonLabel(d => `<div style="padding:4px 6px"><b>${d.properties?.name || d.id}</b></div>`);

        // Hover feedback (only for yellow countries)
        globe.onPolygonHover(f => {
          const interactive = f && GLEEDS_COUNTRIES.has(f.id);
          renderer.domElement.style.cursor = interactive ? 'pointer' : 'grab';
        });

        // Click to zoom (only for Gleeds countries)
        globe.onPolygonClick(f => {
          if (!f || !GLEEDS_COUNTRIES.has(f.id)) return;
          zoomToFeature(f);
          if (f.id === 'USA') loadUSAStatesOverlay();
        });
      })
      .catch(err => {
        alert('Could not load world boundaries from /assets/world-110m.geojson\n' + err);
      });

    // --- UI buttons ---
    document.getElementById('btnBackWorld').addEventListener('click', () => {
      clearUSAStates();
      viewHome();
    });

    document.getElementById('btnHideStates').addEventListener('click', () => {
      clearUSAStates();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      controls.reset();
      clearUSAStates();
      viewHome();
    });
  })();
  </script>
</body>
</html>
