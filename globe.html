<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive 3D Globe</title>
  <style>
    html,body { height:100%; margin:0; background:#000; color:#eee; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif }
    #globe-canvas { position:fixed; inset:0; }
    .toolbar {
      position: fixed; top:8px; left:8px; z-index:10; display:flex; gap:.5rem; flex-wrap:wrap;
      background:rgba(0,0,0,.5); padding:6px 8px; border-radius:8px; backdrop-filter: blur(4px);
    }
    .btn { border:1px solid #333; background:#111; color:#eee; padding:6px 10px; border-radius:6px; cursor:pointer; }
    .btn:hover { background:#222; }
    .hint {
      position:fixed; left:8px; bottom:8px; z-index:10; font-size:.8rem; color:#aaa;
      background:rgba(0,0,0,.5); padding:6px 10px; border-radius:8px; backdrop-filter: blur(4px);
    }
  </style>

  <!-- ========= COMPATIBLE LIB VERSIONS ========= -->
  <!-- three r146 (stable with current three-globe) -->
  <script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
  <!-- three-globe UMD: instantiate with 'new ThreeGlobe()' -->
  <script src="https://unpkg.com/three-globe@2.28.10/dist/three-globe.min.js"></script>
  <!-- d3 v7 (ok) -->
  <script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
  <!-- d3-geo v1 (needed to avoid the Adder constructor error) -->
  <script src="https://unpkg.com/d3-geo@1.12.1/build/d3-geo.min.js"></script>
</head>
<body>
  <div class="toolbar">
    <button class="btn" id="btn-gleeds">Gleeds Countries</button>
    <button class="btn" id="btn-world">Back to World</button>
    <button class="btn" id="btn-usa">Back to USA</button>
    <button class="btn" id="btn-reset">Reset View</button>
  </div>
  <div class="hint">Drag to spin • Scroll to zoom • Click a yellow country • Click a state when USA is active</div>
  <div id="globe-canvas"></div>

  <script>
    // ---------- config ----------
    const GLEEDS_YELLOW = '#FFC300';
    const GREY          = '#555555';
    const HOVER_BORDER  = '#ffffff';
    const DEFAULT_EDGE  = 'rgba(0,0,0,0.6)';

    // ISO_A3 of Gleeds presence
    const GLEEDS_COUNTRIES = new Set([
      'GBR','IRL',
      'AUT','CZE','FRA','DEU','HUN','ITA','POL','PRT','ROU','SVK','ESP','UKR',
      'EGY','QAT','SAU','ARE',
      'AUS','CHN','HKG','IND','SGP','VNM',
      'CAN','PER','TTO','USA',
      'BGR','HRV','MNE','SRB','BEL','CHE','LUX','GRC','DNK','FIN','NLD','NOR','SWE',
      'ZAF','LKA','ECU'
    ]);

    const WORLD_URL = 'assets/world.geojson';                  // <— make sure this exists
    const USA_STATES_URL = 'assets/overlays/usa-states.geojson'; // <— and this

    // ---------- three scene ----------
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    document.getElementById('globe-canvas').appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 350;

    const light = new THREE.AmbientLight(0xffffff, 1.1);
    scene.add(light);

    // OrbitControls (from three examples CDN)
    const controlsScript = document.createElement('script');
    controlsScript.src = 'https://unpkg.com/three@0.146.0/examples/js/controls/OrbitControls.js';
    controlsScript.onload = initGlobe;
    document.head.appendChild(controlsScript);

    let controls, globe, worldFeatures = [], usaStates = [];
    let hovered = null;
    let showingUSAStates = false;

    function initGlobe(){
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 120;
      controls.maxDistance = 500;

      // Instantiate Globe (UMD)
      globe = new ThreeGlobe()
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
        .showAtmosphere(true)
        .atmosphereColor('#7aa7ff')
        .atmosphereAltitude(0.14);

      scene.add(globe);

      loadData().then(() => {
        // initial view
        focusView({ lat: 20, lng: 0, altitude: 2.2 });
        animate();
      });

      window.addEventListener('resize', onResize, false);
      wireButtons();
    }

    async function loadData(){
      try {
        // World polygons (GeoJSON)
        const world = await fetch(WORLD_URL).then(r => r.json());
        worldFeatures = world.features || [];
        globe
          .polygonsData(worldFeatures)
          .polygonCapColor(f => GLEEDS_COUNTRIES.has(f.id) ? GLEEDS_YELLOW : GREY)
          .polygonSideColor(f => (f===hovered ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.2)'))
          .polygonStrokeColor(f => (f===hovered ? HOVER_BORDER : DEFAULT_EDGE))
          .polygonAltitude(f => (f===hovered ? 0.06 : 0.01))
          .polygonsTransitionDuration(300)
          .onPolygonHover(f => {
            hovered = f;
            globe
              .polygonSideColor(ff => (ff===hovered ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.2)'))
              .polygonStrokeColor(ff => (ff===hovered ? HOVER_BORDER : DEFAULT_EDGE))
              .polygonAltitude(ff => (ff===hovered ? 0.06 : 0.01));
          })
          .onPolygonClick(f => {
            if (!f) return;
            const name = f.properties?.name || f.id;
            if (name === 'United States of America' || f.id === 'USA') {
              showUSAStates();
            } else {
              zoomToFeature(f);
            }
          });

        // USA states (GeoJSON)
        const states = await fetch(USA_STATES_URL).then(r => r.json());
        usaStates = states.features || [];
      } catch (e) {
        alert('Failed to load GeoJSON. Check that the asset files exist and paths are correct.');
        console.error(e);
      }
    }

    function showUSAStates(){
      if (!usaStates.length) return;
      showingUSAStates = true;

      globe.polygonCapColor(f => {
        const nm = f.properties?.name || f.id;
        // Hide all countries (make fully transparent) except USA outline
        if (f.id === 'USA' || nm === 'United States of America') return 'rgba(255,195,0,0.12)';
        return 'rgba(0,0,0,0)'; // hide other countries
      });

      // Add a second polygon layer via "hexPolygonsData" trick OR re-use single layer:
      // simplest for now: draw states as lines using "arcs" (so we don't alter world data)
      // But three-globe polygon layer needed to click states—so reuse the same layer temporarily.

      // Replace polygons with the states for interaction, keep earth visible via globe texture
      globe
        .polygonsData(usaStates)
        .polygonCapColor(() => 'rgba(255,195,0,0.75)')
        .polygonSideColor(() => 'rgba(0,0,0,0.15)')
        .polygonStrokeColor(() => '#111')
        .polygonAltitude(f => (f===hovered ? 0.04 : 0.02))
        .onPolygonHover(f => {
          hovered = f;
          globe
            .polygonStrokeColor(ff => (ff===hovered ? '#fff' : '#111'))
            .polygonAltitude(ff => (ff===hovered ? 0.04 : 0.02));
        })
        .onPolygonClick(f => {
          if (f) zoomToFeature(f);
        });

      // Focus camera over CONUS
      focusView({ lat: 39, lng: -98, altitude: 0.9 });
    }

    function backToWorld(){
      showingUSAStates = false;
      globe
        .polygonsData(worldFeatures)
        .polygonCapColor(f => GLEEDS_COUNTRIES.has(f.id) ? GLEEDS_YELLOW : GREY)
        .polygonSideColor(() => 'rgba(0,0,0,0.2)')
        .polygonStrokeColor(() => DEFAULT_EDGE)
        .polygonAltitude(() => 0.01)
        .onPolygonHover(f => {
          if (!f || !GLEEDS_COUNTRIES.has(f.id)) { hovered = null; return; }
          hovered = f;
          globe
            .polygonSideColor(ff => (ff===hovered ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.2)'))
            .polygonStrokeColor(ff => (ff===hovered ? HOVER_BORDER : DEFAULT_EDGE))
            .polygonAltitude(ff => (ff===hovered ? 0.06 : 0.01));
        })
        .onPolygonClick(f => {
          if (!f) return;
          const name = f.properties?.name || f.id;
          if (name === 'United States of America' || f.id === 'USA') showUSAStates();
          else zoomToFeature(f);
        });

      focusView({ lat: 20, lng: 0, altitude: 2.2 });
    }

    function zoomToFeature(feat){
      try {
        const [lng, lat] = d3.geoCentroid(feat);
        const [[minLng,minLat],[maxLng,maxLat]] = d3.geoBounds(feat);
        const latSpan = Math.max(0.001, Math.abs(maxLat - minLat));
        const midLat = (maxLat + minLat)/2;
        const lngSpan = Math.max(0.001, Math.abs(maxLng - minLng) * Math.cos(Math.abs(midLat) * Math.PI/180));
        const span = Math.max(latSpan, lngSpan);
        // altitude tuned: smaller area -> closer
        let altitude = 2.0;
        if (span > 60) altitude = 1.6;
        else if (span > 30) altitude = 1.2;
        else if (span > 15) altitude = 0.9;
        else if (span > 8)  altitude = 0.65;
        else if (span > 4)  altitude = 0.5;
        else if (span > 2)  altitude = 0.38;
        else altitude = 0.28;

        focusView({ lat, lng, altitude });
      } catch (e) {
        console.warn('zoomToFeature failed', e);
      }
    }

    function focusView({ lat, lng, altitude }){
      // orbit-controls target
      const phi   = (90 - lat) * (Math.PI/180);
      const theta = (lng + 180) * (Math.PI/180);
      const r = 200; // earth radius used internally by three-globe
      controls.target.set(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
      controls.update();
      globe.pointOfView({ lat, lng, altitude }, 1200);
    }

    function animate(){
      requestAnimationFrame(animate);
      controls && controls.update();
      renderer.render(scene, camera);
    }

    function onResize(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function wireButtons(){
      document.getElementById('btn-gleeds').onclick = () => backToWorld();
      document.getElementById('btn-world').onclick  = () => backToWorld();
      document.getElementById('btn-usa').onclick    = () => showUSAStates();
      document.getElementById('btn-reset').onclick  = () => focusView({ lat: 20, lng: 0, altitude: 2.2 });
    }
  </script>
</body>
</html>
