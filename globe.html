<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Interactive 3D Globe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body {height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial}
    #globe-container {position:fixed;inset:0}
    .hud {position:fixed;top:10px;left:10px;z-index:5;display:flex;gap:.5rem}
    .btn{background:#1f2937;color:#fff;border:1px solid #374151;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .legend{position:fixed;bottom:10px;left:10px;color:#bbb;font-size:12px;z-index:5}
  </style>
</head>
<body>
  <div class="hud">
    <button class="btn" id="btn-world">Back to Globe</button>
    <button class="btn" id="btn-usa" style="display:none;">Back to USA</button>
    <button class="btn" id="btn-reset">Reset View</button>
  </div>
  <div id="globe-container"></div>
  <div class="legend">Drag to spin • Scroll to zoom • Click a <b>yellow</b> country • Click a state when USA is active</div>

  <!-- Local vendor scripts (UMD builds) -->
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/OrbitControls.js"></script>
  <script src="assets/vendor/three-globe.min.js"></script>
  <script src="assets/vendor/d3-geo.v1.min.js"></script>

  <script>
  // -------------------- configuration --------------------
  const WORLD_URL = 'assets/world.geojson';
  const USA_STATES_URL = 'assets/overlays/usa-states.geojson';

  const YELLOW = '#FFC300';
  const GREY   = 'rgba(120,120,120,0.65)';
  const STROKE = 'rgba(0,0,0,0.65)';

  // Gleeds presence (ISO-A3 codes)
  const GLEEDS = new Set([
    'GBR','IRL','AUT','CZE','FRA','DEU','HUN','ITA','POL','PRT','ROU','SVK','ESP','UKR',
    'EGY','QAT','SAU','ARE',
    'AUS','CHN','HKG','IND','SGP','VNM',
    'CAN','PER','TTO','USA',
    'BGR','HRV','MNE','SRB','BEL','CHE','LUX','GRC','DNK','FIN','NLD','NOR','SWE','ZAF','LKA','ECU'
  ]);

  // -------------------- three.js scene --------------------
  const container = document.getElementById('globe-container');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
  camera.position.z = 300;

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;
  controls.minDistance = 120;
  controls.maxDistance = 600;

  const globe = new ThreeGlobe()
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
    .showAtmosphere(true)
    .atmosphereAltitude(0.25);

  scene.add(globe);

  // lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
  dirLight.position.set(1, 1, 1);
  scene.add(dirLight);

  // responsiveness
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // -------------------- state --------------------
  let mode = 'world';      // 'world' | 'usa' | 'usa-state'
  let worldFeatures = [];
  let usaFeatures = [];

  // -------------------- data loaders --------------------
  async function loadWorld() {
    const res = await fetch(WORLD_URL);
    if (!res.ok) throw new Error('World GeoJSON not found');
    const gj = await res.json();
    worldFeatures = gj.features || [];
  }

  async function loadUSA() {
    if (usaFeatures.length) return usaFeatures;
    const res = await fetch(USA_STATES_URL);
    if (!res.ok) throw new Error('USA states GeoJSON not found');
    const gj = await res.json();
    usaFeatures = gj.features || [];
    return usaFeatures;
  }

  // -------------------- helpers --------------------
  function focusFeature(feat, ms = 1200) {
    // centroid + altitude from bounds
    const [lng, lat] = d3.geoCentroid(feat);
    const b = d3.geoBounds(feat);
    const latSpan = Math.abs(b[1][1] - b[0][1]);
    const lngSpan = Math.abs(b[1][0] - b[0][0]) * Math.cos(Math.abs(lat) * Math.PI/180);
    const span = Math.max(latSpan, lngSpan);
    let altitude =
      span > 60 ? 1.6 :
      span > 30 ? 1.2 :
      span > 15 ? 0.9 :
      span >  8 ? 0.65 :
      span >  4 ? 0.50 :
      span >  2 ? 0.38 : 0.28;

    globe.pointOfView({ lat, lng, altitude }, ms);
  }

  function applyWorldStyle() {
    globe
      .polygonsData(worldFeatures)
      .polygonCapColor(f => (GLEEDS.has(f.id) ? YELLOW : GREY))
      .polygonSideColor(() => 'rgba(0,0,0,0.25)')
      .polygonStrokeColor(() => STROKE)
      .polygonAltitude(f => (GLEEDS.has(f.id) ? 0.02 : 0.01))
      .polygonsTransitionDuration(300);
  }

  function applyUSAStyle() {
    globe
      .polygonsData(usaFeatures)
      .polygonCapColor(() => YELLOW)
      .polygonSideColor(() => 'rgba(0,0,0,0.25)')
      .polygonStrokeColor(() => STROKE)
      .polygonAltitude(() => 0.025)
      .polygonsTransitionDuration(300);
  }

  function setMode(newMode) {
    mode = newMode;
    document.getElementById('btn-usa').style.display = (mode === 'usa-state') ? 'inline-block' : 'none';
  }

  async function goWorld(reset = false) {
    setMode('world');
    applyWorldStyle();
    if (reset) globe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1200);
  }

  async function goUSAOverview() {
    await loadUSA();
    setMode('usa');
    applyUSAStyle();
    globe.pointOfView({ lat: 39, lng: -98, altitude: 0.9 }, 1200); // USA center
  }

  // -------------------- interactions (UMD API) --------------------
  // UMD build uses polygonClick / polygonHover (not onPolygonClick)
  globe.polygonHover(feat => {
    if (mode === 'world' && feat && !GLEEDS.has(feat.id)) return; // ignore grey countries
    renderer.domElement.style.cursor = feat ? 'pointer' : 'grab';
  });

  globe.polygonClick(async feat => {
    if (!feat) return;

    if (mode === 'world') {
      if (!GLEEDS.has(feat.id)) return;   // only yellow countries interactive
      if (feat.id === 'USA') {
        await goUSAOverview();
        return;
      }
      focusFeature(feat);
      return;
    }

    if (mode === 'usa') {
      // click a state -> zoom a bit closer
      focusFeature(feat);
      setMode('usa-state');
      return;
    }

    if (mode === 'usa-state') {
      // clicking again focuses that state tighter
      focusFeature(feat);
    }
  });

  // -------------------- buttons --------------------
  document.getElementById('btn-world').addEventListener('click', () => goWorld(true));
  document.getElementById('btn-usa').addEventListener('click', () => goUSAOverview());
  document.getElementById('btn-reset').addEventListener('click', () => globe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1000));

  // -------------------- init --------------------
  (async () => {
    try {
      await loadWorld();
      applyWorldStyle();
      globe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1200);
    } catch (e) {
      alert('Globe init failed: ' + e.message);
    }
  })();

  // -------------------- render loop --------------------
  (function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
  </script>
</body>
</html>
