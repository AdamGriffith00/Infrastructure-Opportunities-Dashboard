<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gleeds | Interactive 3D Globe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- MapLibre GL (CDN) -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- Turf for bbox -->
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <style>
    :root { --gleeds:#f7c400; --charcoal:#3c3c3c; }
    html, body { height: 100%; margin: 0; background: #222; }
    #map { position: fixed; inset: 0; }

    .hud {
      position: fixed; top: 10px; left: 10px; z-index: 2;
      background: rgba(60,60,60,.85); color: #fff; padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
      font: 14px/1.4 Arial, sans-serif;
    }
    .hud b { color: var(--gleeds); }
  </style>
</head>
<body>
  <div id="map" aria-label="3D globe map"></div>
  <div class="hud">Hover to highlight · Click to <b>zoom</b> &amp; <b>outline</b></div>

  <script>
    // 1) Base map
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://demotiles.maplibre.org/style.json', // simple basemap
      center: [0, 20],
      zoom: 1.4
      // NOTE: some styles force their own projection on load,
      // so we set the globe AFTER style.load below.
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    // Force the globe AFTER the style is applied
    map.on('style.load', () => {
      map.setProjection({ name: 'globe' });   // <<--- key fix for space-view 🌍
      map.setFog({
        color: 'rgba(120,120,120,0.07)',
        highColor: 'rgba(255,255,255,0.08)',
        horizonBlend: 0.1
      });
    });

    // 2) Countries source/layers
    const COUNTRIES_GEOJSON_URL = 'https://geojson-maps.ash.ms/world.geo.json';

    map.on('load', async () => {
      const data = await fetch(COUNTRIES_GEOJSON_URL).then(r => r.json());

      // Ensure we have stable feature ids for feature-state
      // If the file already has 'id' we keep it; otherwise synthesize from ISO3/name
      data.features.forEach((f, idx) => {
        if (typeof f.id === 'undefined') {
          f.id = f.properties?.iso_a3 || f.properties?.adm0_a3 || f.properties?.name || idx;
        }
      });

      map.addSource('countries', { type: 'geojson', data });

      // Fill (hover reacts; selected gets stronger)
      map.addLayer({
        id: 'country-fill',
        type: 'fill',
        source: 'countries',
        paint: {
          'fill-color': '#f7c400',
          'fill-opacity': [
            'case',
            ['boolean', ['feature-state', 'selected'], false], 0.45,
            ['boolean', ['feature-state', 'hover'], false],    0.30,
            0.18
          ]
        }
      });

      // Outline (thin base)
      map.addLayer({
        id: 'country-outline',
        type: 'line',
        source: 'countries',
        paint: {
          'line-color': '#f7c400',
          'line-width': 0.6
        }
      });

      // Selected outline (bold)
      map.addLayer({
        id: 'country-outline-selected',
        type: 'line',
        source: 'countries',
        filter: ['==', ['id'], ''], // empty initially; we’ll set it on click
        paint: {
          'line-color': '#f7c400',
          'line-width': 2.4
        }
      });

      // 3) Hover + click state handling
      let hoveredId = null;
      let selectedId = null;

      map.on('mousemove', 'country-fill', (e) => {
        map.getCanvas().style.cursor = 'pointer';
        const f = e.features?.[0];
        if (!f) return;

        if (hoveredId !== null && hoveredId !== selectedId) {
          map.setFeatureState({ source: 'countries', id: hoveredId }, { hover: false });
        }
        hoveredId = f.id;

        if (hoveredId !== selectedId) {
          map.setFeatureState({ source: 'countries', id: hoveredId }, { hover: true });
        }
      });

      map.on('mouseleave', 'country-fill', () => {
        map.getCanvas().style.cursor = '';
        if (hoveredId !== null && hoveredId !== selectedId) {
          map.setFeatureState({ source: 'countries', id: hoveredId }, { hover: false });
        }
        hoveredId = null;
      });

      map.on('click', 'country-fill', (e) => {
        const f = e.features?.[0];
        if (!f) return;

        // Clear previous selected
        if (selectedId !== null) {
          map.setFeatureState({ source: 'countries', id: selectedId }, { selected: false });
        }

        selectedId = f.id;
        map.setFeatureState({ source: 'countries', id: selectedId }, { selected: true });

        // Update selected outline filter to the clicked feature id
        map.setFilter('country-outline-selected', ['==', ['id'], selectedId]);

        // Smooth zoom to country
        const bb = turf.bbox(f); // [minX,minY,maxX,maxY]
        map.fitBounds([[bb[0], bb[1]], [bb[2], bb[3]]], {
          padding: 60,
          duration: 1200,
          maxZoom: 6
        });

        // Optional: set URL param for your dashboard to load country data
        const name = f.properties?.name || f.properties?.ADMIN || f.properties?.admin || 'country';
        const url = new URL(window.location.href);
        url.searchParams.set('country', name);
        history.replaceState({}, '', url.toString());
      });
    });
  </script>
</body>
</html>
