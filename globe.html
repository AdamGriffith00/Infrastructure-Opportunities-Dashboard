<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive 3D Globe</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #globeViz { width: 100vw; height: 100vh; }
    #loading {
      position: absolute; top: 10px; right: 10px;
      color: lime; font-family: monospace; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <div id="loading">Loading...</div>

  <!-- Vendor scripts -->
  <script src="/assets/vendor/three.min.js"></script>
  <script src="/assets/vendor/OrbitControls.js"></script>
  <script src="/assets/vendor/d3-geo.v1.min.js"></script>
  <script src="/assets/vendor/three-globe.min.js"></script>

  <script>
    const container = document.getElementById('globeViz');

    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 250;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = true;

    // Lights
    scene.add(new THREE.AmbientLight(0xbbbbbb));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(1, 1, 1);
    scene.add(dirLight);

    // Globe
    const globe = new ThreeGlobe()
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png');

    scene.add(globe);

    // Load country polygons
    fetch('/assets/world-110m.geojson')
      .then(res => res.json())
      .then(countries => {
        globe
          .polygonsData(countries.features)
          .polygonCapColor(feat => {
            // Gleeds yellow for UK, rest grey
            const highlight = ['United Kingdom'];
            return highlight.includes(feat.properties.name)
              ? 'rgba(255, 215, 0, 0.8)'
              : 'rgba(100,100,100,0.3)';
          })
          .polygonStrokeColor(() => '#111')
          .polygonLabel(({ properties: d }) => `
            <b>${d.name}</b>
          `);

        document.getElementById('loading').innerText = 'Loaded ✅';
      })
      .catch(err => {
        console.error('GeoJSON load error:', err);
        alert('Could not load world boundaries from /assets/world-110m.geojson');
      });

    // Animate
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
