<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interactive 3D Globe</title>
  <style>
    html, body { height:100%; margin:0; background:#000; color:#fff; font-family:system-ui,Segoe UI,Arial,sans-serif; }
    #ui { position:fixed; left:8px; top:8px; z-index:10; display:flex; gap:.5rem; }
    .btn { background:#1f2937; border:1px solid #374151; color:#e5e7eb; padding:.35rem .6rem; border-radius:.5rem; cursor:pointer; }
    .btn:hover { background:#374151; }
    #hint { position:fixed; left:8px; bottom:8px; opacity:.7; font-size:.8rem; }
    canvas { display:block; }
  </style>
</head>
<body>
  <div id="ui">
    <button class="btn" id="btnHome">Gleeds Countries</button>
    <button class="btn" id="btnWorld">Back to World</button>
    <button class="btn" id="btnUSA">Back to USA</button>
    <button class="btn" id="btnReset">Reset View</button>
  </div>
  <div id="hint">Drag to spin • Scroll to zoom • Click a yellow country • Click a state when USA is active</div>
  <div id="globeContainer"></div>

  <!-- Use modern ES Modules to avoid “Globe is not a function” / script build mismatches -->
  <script type="module">
    /***************** Imports (ESM) *****************/
    import * as THREE from 'https://unpkg.com/three@0.159.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.159.0/examples/jsm/controls/OrbitControls.js';
    import ThreeGlobe from 'https://unpkg.com/three-globe@2.31.1/dist/three-globe.module.js';

    /***************** Config *****************/
    const WORLD_URL = 'assets/world.geojson';            // <= keep both files in /assets/
    const USA_STATES_URL = 'assets/usa-states.geojson';  // <= states overlay

    const GLEEDS_YELLOW = '#FFC300';
    const NON_GLEEDS_GREY = '#555555';
    const HOVER_BORDER = '#FFFFFF';
    const DEFAULT_BORDER = 'rgba(0,0,0,0.7)';
    const GLEEDS_COUNTRIES = new Set([
      'GBR','IRL','AUT','CZE','FRA','DEU','HUN','ITA','POL','PRT','ROU','SVK','ESP','UKR',
      'EGY','QAT','SAU','ARE',
      'AUS','CHN','HKG','IND','SGP','VNM',
      'CAN','PER','TTO','USA',
      'BGR','HRV','MNE','SRB','BEL','CHE','LUX','GRC','DNK','FIN','NLD','NOR','SWE',
      'ZAF','LKA','ECU'
    ]);

    /***************** Scene *****************/
    const container = document.getElementById('globeContainer');

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 380);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 140;
    controls.maxDistance = 700;

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(-50, 60, 30);
    scene.add(dirLight);

    // Base globe (so you always see something even if polygons fail to load)
    const globe = new ThreeGlobe()
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .showAtmosphere(true)
      .atmosphereAltitude(0.12);

    scene.add(globe);

    /***************** Helpers *****************/
    function logFetch(url) { console.log('[globe] fetching', url); }
    async function fetchJSON(url) {
      logFetch(url);
      const res = await fetch(url, { cache:'no-cache' });
      if (!res.ok) throw new Error(`${url} → ${res.status} ${res.statusText}`);
      return res.json();
    }

    function centroidOf(feat) {
      // quick centroid (average of bbox corners if present)
      const b = feat.bbox;
      if (b) {
        const [minLng,minLat,maxLng,maxLat] = b;
        return [(minLng+maxLng)/2, (minLat+maxLat)/2];
      }
      // rough fallback: get first coordinate
      const g = feat.geometry;
      let c = g.coordinates;
      while (Array.isArray(c[0])) c = c[0];
      const [lng, lat] = c;
      return [lng, lat];
    }

    function altitudeForFeature(feat) {
      const b = feat.bbox;
      if (!b) return 0.9;
      const [minLng,minLat,maxLng,maxLat] = b;
      const latSpan = Math.max(0.0001, Math.abs(maxLat - minLat));
      const midLat = (maxLat + minLat) / 2;
      const lngSpan = Math.max(0.0001, Math.abs(maxLng - minLng)) * Math.cos(Math.abs(midLat) * Math.PI / 180);
      const span = Math.max(latSpan, lngSpan);
      if (span > 60) return 1.6;
      if (span > 30) return 1.2;
      if (span > 15) return 0.9;
      if (span > 8 ) return 0.65;
      if (span > 4 ) return 0.5;
      if (span > 2 ) return 0.38;
      return 0.28;
    }

    function focusFeature(feat) {
      const [lng, lat] = centroidOf(feat);
      const altitude = altitudeForFeature(feat);
      controls.autoRotate = false;
      globe.pointOfView({ lat, lng, altitude }, 1200);
    }

    function resetView() {
      controls.autoRotate = true;
      globe.pointOfView({ lat:20, lng:0, altitude:2.2 }, 1200);
    }

    /***************** Data + interaction *****************/
    let worldFeatures = [];
    let usaStates = [];
    let activeCountryId = null;

    // first draw world polygons
    try {
      const world = await fetchJSON(WORLD_URL);
      worldFeatures = world.features ?? [];
      // if bbox missing, derive a coarse one (for zoom)
      for (const f of worldFeatures) {
        if (!f.bbox && f.geometry && f.geometry.coordinates) {
          try {
            // crude bbox from coordinates (enough for zoom)
            let minLng=180, minLat=90, maxLng=-180, maxLat=-90;
            const crawl = (coords) => {
              if (typeof coords[0] === 'number') {
                const [lng, lat] = coords;
                minLng = Math.min(minLng, lng); maxLng = Math.max(maxLng, lng);
                minLat = Math.min(minLat, lat); maxLat = Math.max(maxLat, lat);
              } else coords.forEach(crawl);
            };
            crawl(f.geometry.coordinates);
            f.bbox = [minLng, minLat, maxLng, maxLat];
          } catch {}
        }
      }

      globe
        .polygonsData(worldFeatures)
        .polygonCapColor(d => GLEEDS_COUNTRIES.has(d.id) ? GLEEDS_YELLOW : NON_GLEEDS_GREY)
        .polygonSideColor(d => 'rgba(0,0,0,0.25)')
        .polygonStrokeColor(d => (GLEEDS_COUNTRIES.has(d.id) ? '#000' : DEFAULT_BORDER))
        .polygonAltitude(d => (GLEEDS_COUNTRIES.has(d.id) ? 0.015 : 0.01))
        .polygonsTransitionDuration(300)
        .polygonLabel(d => `<div style="padding:.25rem .35rem">${d.properties?.name || d.id}</div>`);

      globe.onPolygonHover(d => {
        // only highlight the countries we operate in
        globe.polygonStrokeColor(f =>
          f === d && GLEEDS_COUNTRIES.has(f.id) ? HOVER_BORDER :
          (GLEEDS_COUNTRIES.has(f.id) ? '#000' : DEFAULT_BORDER)
        );
      });

      globe.onPolygonClick(d => {
        if (!GLEEDS_COUNTRIES.has(d.id)) return;  // non-Gleeds countries don’t interact
        activeCountryId = d.id;
        focusFeature(d);
        if (d.id === 'USA') drawUSAStatesOverlay();
      });

      resetView();
    } catch (e) {
      console.error('[globe] failed to render world polygons', e);
      alert('Could not load world.geojson – check /assets/world.geojson and console.');
    }

    async function drawUSAStatesOverlay() {
      // load states once
      if (!usaStates.length) {
        try {
          const gj = await fetchJSON(USA_STATES_URL);
          usaStates = gj.features ?? [];
        } catch (e) {
          console.error('[globe] failed to load USA states', e);
          alert('Could not load usa-states.geojson – check /assets/usa-states.geojson and console.');
          return;
        }
      }
      // draw as separate polygons layer (the API supports a single layer,
      // so a simple trick is to temporarily swap the data to states)
      globe.polygonsData(usaStates)
        .polygonCapColor(() => GLEEDS_YELLOW)
        .polygonSideColor(() => 'rgba(0,0,0,0.25)')
        .polygonStrokeColor(() => '#000')
        .polygonAltitude(() => 0.02)
        .polygonsTransitionDuration(300)
        .polygonLabel(d => `<div style="padding:.25rem .35rem">${d.properties?.name}</div>`);

      // focus to USA extent
      // if you want a guaranteed focus, compute centroid of all states
      const usa = worldFeatures.find(f => f.id === 'USA');
      if (usa) focusFeature(usa);

      globe.onPolygonClick(d => {
        // clicking a state = zoom a little more
        focusFeature(d);
      });
    }

    /***************** Buttons *****************/
    document.getElementById('btnHome').onclick = () => {
      // outline logic already applied via colors; just reset view
      resetView();
    };
    document.getElementById('btnWorld').onclick = () => {
      activeCountryId = null;
      globe.polygonsData(worldFeatures)
        .polygonCapColor(d => GLEEDS_COUNTRIES.has(d.id) ? GLEEDS_YELLOW : NON_GLEEDS_GREY)
        .polygonStrokeColor(d => (GLEEDS_COUNTRIES.has(d.id) ? '#000' : DEFAULT_BORDER))
        .polygonAltitude(d => (GLEEDS_COUNTRIES.has(d.id) ? 0.015 : 0.01));
      resetView();
    };
    document.getElementById('btnUSA').onclick = drawUSAStatesOverlay;
    document.getElementById('btnReset').onclick = resetView;

    /***************** Animate *****************/
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    (function animate(){
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();

    /***************** Helpful logging *****************/
    // Quick “can the files be fetched?” probes
    fetch(WORLD_URL).then(r => console.log('[probe] world.geojson', r.status, r.ok)).catch(console.error);
    fetch(USA_STATES_URL).then(r => console.log('[probe] usa-states.geojson', r.status, r.ok)).catch(console.error);
  </script>
</body>
</html>
