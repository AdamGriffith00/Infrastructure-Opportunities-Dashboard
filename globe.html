<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive 3D Globe</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: #000; }
    #globeViz { position: absolute; inset: 0; }
    .top-bar{
      position: fixed; top: 10px; left: 10px; z-index: 10;
      display: flex; gap: 8px;
    }
    button{
      padding: 6px 12px; background:#222; color:#fff;
      border:1px solid #555; border-radius:6px; cursor:pointer
    }
    button:hover{ background:#3a3a3a }
    .hint{
      position: fixed; bottom: 10px; left: 10px; z-index: 10;
      color:#aaa; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <button id="btnBackWorld">Back to Globe</button>
    <button id="btnReset">Reset View</button>
  </div>
  <div class="hint">
    Drag to spin • Scroll to zoom • Click a <b>yellow</b> country • Click a state when USA is active
  </div>
  <div id="globeViz"></div>

  <!-- Stable, compatible builds -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three-globe@2.24.10/dist/three-globe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>

  <script>
    // --- Config ---
    const WORLD_GEOJSON_URL = 'assets/world.geojson';
    const USA_STATES_URL    = 'assets/overlays/usa-states.geojson';

    const GLEEDS_YELLOW = '#FFC300';
    const GREY          = 'rgba(120,120,120,0.6)';
    const STROKE        = '#101010';

    // Gleeds countries (ISO_A3)
    const GLEEDS = new Set([
      'GBR','IRL',
      'AUT','CZE','FRA','DEU','HUN','ITA','POL','PRT','ROU','SVK','ESP','UKR',
      'EGY','QAT','SAU','ARE',
      'AUS','CHN','HKG','IND','SGP','VNM',
      'CAN','PER','TTO','USA',
      'BGR','HRV','MNE','SRB','BEL','CHE','LUX','GRC','DNK','FIN','NLD','NOR','SWE',
      'ZAF','LKA','ECU'
    ]);

    // --- Three.js scene ---
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('globeViz').appendChild(renderer.domElement);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 10000);
    camera.position.z = 400;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;

    scene.add(new THREE.AmbientLight(0xbbbbbb));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(-50, 80, 100);
    scene.add(dir);

    const globe = new ThreeGlobe()
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
      .showAtmosphere(true)
      .atmosphereAltitude(0.22)
      .atmosphereColor('#2e2a75');

    scene.add(globe);

    // --- Data holders / mode ---
    let worldFeatures = [];
    let usaStateFeatures = [];
    let mode = 'world'; // 'world' | 'usa'

    // --- Helpers ---
    const centroidOf = (feat) => d3.geoCentroid(feat);

    function altitudeForFeature(feat) {
      try {
        const [[minLng,minLat],[maxLng,maxLat]] = d3.geoBounds(feat);
        const latSpan = Math.max(0.0001, Math.abs(maxLat - minLat));
        const midLat  = (maxLat + minLat) / 2;
        const lngSpan = Math.max(0.0001, Math.abs(maxLng - minLng)) *
                        Math.cos(Math.abs(midLat) * Math.PI/180);
        const span = Math.max(latSpan, lngSpan);
        if (span > 60) return 1.6;
        if (span > 30) return 1.2;
        if (span > 15) return 0.9;
        if (span > 8)  return 0.65;
        if (span > 4)  return 0.50;
        if (span > 2)  return 0.38;
        return 0.28;
      } catch { return 1.0; }
    }

    function focusFeature(feat, ms=1200) {
      const [lng, lat] = centroidOf(feat);
      const altitude   = altitudeForFeature(feat);
      globe.pointOfView({ lat, lng, altitude }, ms);
    }

    // --- Styling functions (depend on mode) ---
    function worldCap(feat) {
      return GLEEDS.has(feat.id) ? GLEEDS_YELLOW : GREY;
    }
    function worldAlt(feat) {
      return GLEEDS.has(feat.id) ? 0.03 : 0.01;
    }
    function worldStroke() { return STROKE; }

    function usaCap()   { return GLEEDS_YELLOW; }
    function usaAlt(f)  { return 0.03; }
    function usaStroke(){ return STROKE; }

    // --- Loading ---
    async function loadWorld() {
      mode = 'world';
      if (!worldFeatures.length) {
        const gj = await fetch(WORLD_GEOJSON_URL).then(r=>r.json());
        worldFeatures = gj.features || [];
      }
      globe
        .polygonsData(worldFeatures)
        .polygonCapColor(worldCap)
        .polygonAltitude(worldAlt)
        .polygonSideColor(()=>'rgba(0,0,0,0.15)')
        .polygonStrokeColor(worldStroke)
        .polygonLabel((d)=>`<b>${d.properties?.name || d.id}</b>`);
    }

    async function loadUSA() {
      mode = 'usa';
      if (!usaStateFeatures.length) {
        const gj = await fetch(USA_STATES_URL).then(r=>r.json());
        usaStateFeatures = gj.features || [];
      }
      globe
        .polygonsData(usaStateFeatures)
        .polygonCapColor(usaCap)
        .polygonAltitude(usaAlt)
        .polygonSideColor(()=>'rgba(0,0,0,0.15)')
        .polygonStrokeColor(usaStroke)
        .polygonLabel((d)=>`<b>${d.properties?.name || d.id}</b>`);
    }

    // --- Interactions ---
    globe.onPolygonClick((feat) => {
      if (mode === 'world') {
        // Only act on Gleeds countries
        if (!GLEEDS.has(feat.id)) return;
        if (feat.id === 'USA') {
          // Enter USA overlay
          loadUSA().then(()=> {
            // smooth camera to USA overall centroid (from world feature)
            focusFeature(feat, 900);
            // then a gentle settle
            setTimeout(()=> globe.pointOfView({ ...globe.pointOfView(), altitude: 0.85 }, 900), 950);
          });
          return;
        }
        // Zoom to selected Gleeds country
        focusFeature(feat);
      } else {
        // USA mode: click state to zoom
        focusFeature(feat);
      }
    });

    // --- Buttons ---
    document.getElementById('btnBackWorld').onclick = () => {
      loadWorld().then(()=> globe.pointOfView({ lat:20, lng:0, altitude:2.2 }, 1000));
    };
    document.getElementById('btnReset').onclick = () => {
      globe.pointOfView({ lat:20, lng:0, altitude:2.2 }, 900);
    };

    // --- Initial load ---
    loadWorld().then(()=> globe.pointOfView({ lat:20, lng:0, altitude:2.2 }, 1000));

    // --- Resize ---
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // --- Render loop ---
    (function animate(){
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
