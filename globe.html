<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Globe Diagnostics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;background:#000;color:#ddd;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial}
    #log{position:fixed;inset:0;overflow:auto;padding:16px;white-space:pre-wrap}
    .ok{color:#9FE870}.warn{color:#FFD166}.err{color:#FF6B6B}
  </style>
</head>
<body>
  <div id="log"></div>

  <script>
    const logBox = document.getElementById('log');
    function log(msg, cls=''){ const d=document.createElement('div'); d.className=cls; d.textContent=msg; logBox.appendChild(d); }
    window.onerror = (m, s, l, c, e) => { log(`JS ERROR: ${m} @ ${s}:${l}`, 'err'); if (e && e.stack) log(e.stack, 'err'); };

    (async function run(){
      log('Starting diagnostics…');

      // Try absolute + relative vendor paths
      const vendors = [
        '/assets/vendor/three.min.js',
        '/assets/vendor/OrbitControls.js',
        '/assets/vendor/d3-geo.v1.min.js',
        '/assets/vendor/three-globe.min.js'
      ];

      for (const v of vendors) {
        try {
          await new Promise((res, rej) => {
            const s=document.createElement('script');
            s.src=v + '?v=' + Date.now();
            s.onload=res; s.onerror=()=>rej(new Error('Failed to load '+v));
            document.head.appendChild(s);
          });
          log('Loaded: ' + v, 'ok');
        } catch (e) {
          log(e.message, 'err');
        }
      }

      // Report globals
      log('THREE present: ' + !!window.THREE, window.THREE ? 'ok' : 'err');
      log('OrbitControls present: ' + !!(window.THREE && THREE.OrbitControls), (window.THREE && THREE.OrbitControls)?'ok':'warn');
      log('d3 present: ' + !!window.d3, window.d3?'ok':'warn');
      log('ThreeGlobe present: ' + !!window.ThreeGlobe, window.ThreeGlobe?'ok':'err');

      // Try both absolute and relative data paths
      const worldPaths = ['/assets/world-110m.geojson', 'assets/world-110m.geojson'];
      let worldOk = false, usedPath = '';
      for (const p of worldPaths) {
        try {
          const r = await fetch(p + '?v=' + Date.now());
          if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
          const gj = await r.json();
          const count = Array.isArray(gj.features)? gj.features.length : 0;
          log(`World GeoJSON OK (${count} features) @ ${p}`, 'ok');
          worldOk = true; usedPath = p; break;
        } catch (e) {
          log(`World GeoJSON load failed @ ${p}: ${e.message}`, 'warn');
        }
      }
      if (!worldOk) { log('STOP: world GeoJSON not found under /assets/ or assets/.', 'err'); return; }

      // Try building a minimal globe (no polygons yet)
      try {
        const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
        renderer.setSize(300, 150);
        document.body.appendChild(renderer.domElement);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, 2, 0.1, 1000);
        camera.position.z = 300;
        const globe = new ThreeGlobe().globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        scene.add(globe);
        renderer.render(scene, camera);
        log('ThreeGlobe basic render OK.', 'ok');
      } catch(e) {
        log('ThreeGlobe render failed: ' + e.message, 'err');
      }

      log('\nIf anything above is red, fix that path/file and refresh.');
      log('Once all are green, open /globe.html again.', 'ok');
    })();
  </script>
</body>
</html>
