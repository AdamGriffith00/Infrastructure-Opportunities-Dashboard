<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interactive 3D Globe</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: black;
      }
      #globeViz {
        width: 100%;
        height: 100%;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font-family: Arial, sans-serif;
        font-size: 14px;
        border-radius: 4px;
      }
    </style>
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
  </head>
  <body>
    <div id="globeViz"></div>
    <div id="info">🌍 Drag to spin • Scroll to zoom • Hover to highlight • Click a country to focus</div>

    <script>
      const WORLD_GEOJSON_URL = './assets/world.geojson'; // Local copy now

      const globe = Globe()
        (document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .showAtmosphere(true)
        .atmosphereAltitude(0.15);

      // Load local GeoJSON
      fetch(WORLD_GEOJSON_URL)
        .then(res => res.json())
        .then(countries => {
          globe
            .polygonsData(countries.features)
            .polygonCapColor(() => 'rgba(200,200,200,0.7)')
            .polygonSideColor(() => 'rgba(0,0,0,0.3)')
            .polygonStrokeColor(() => '#111')
            .polygonAltitude(() => 0.01)
            .polygonLabel(d => `
              <b>${d.properties.name}</b>
            `)
            .onPolygonHover(hoverD => globe
              .polygonCapColor(d => d === hoverD ? 'orange' : 'rgba(200,200,200,0.7)')
            )
            .onPolygonClick(d => {
              const coords = d3.geoCentroid(d);
              globe.pointOfView({ lat: coords[1], lng: coords[0], altitude: 1.8 }, 1000);
            });
        });

      // Start at a nice viewpoint
      globe.pointOfView({ lat: 20, lng: 0, altitude: 2.2 });
    </script>

    <!-- D3 for centroid math -->
    <script src="https://d3js.org/d3-geo.v1.min.js"></script>
  </body>
</html>
