<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gleeds | Interactive 3D Globe</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- CesiumJS (CDN, no token needed when using OSM imagery) -->
  <link href="https://unpkg.com/cesium/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://unpkg.com/cesium/Build/Cesium/Cesium.js"></script>

  <style>
    :root { --gleeds:#f7c400; --charcoal:#3c3c3c; }
    html, body { height:100%; margin:0; background:#1e1e1e; }
    #cesiumContainer { position:fixed; inset:0; }
    .hud {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      background: rgba(60,60,60,.85); color:#fff; padding:8px 12px;
      border:1px solid rgba(255,255,255,.15); border-radius:10px;
      font: 14px/1.4 Arial, sans-serif;
    }
    .hud b { color: var(--gleeds); }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="hud">Hover to highlight · Click to <b>outline</b> &amp; <b>fly to</b> a country</div>

  <script>
    // 1) Create viewer with OSM tiles (no token required)
    const viewer = new Cesium.Viewer('cesiumContainer', {
      imageryProvider: new Cesium.UrlTemplateImageryProvider({
        url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        credit: '© OpenStreetMap contributors'
      }),
      baseLayerPicker: false,
      sceneModePicker: false,
      geocoder: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      homeButton: false,
      fullscreenButton: false,
      terrainProvider: new Cesium.EllipsoidTerrainProvider() // simple globe, no token
    });

    // 2) Load world GeoJSON (countries)
    const WORLD_GEOJSON = 'https://geojson-maps.ash.ms/world.geo.json';
    const gleedsYellow = Cesium.Color.fromCssColorString('#f7c400');
    const hoverFill    = gleedsYellow.withAlpha(0.25);
    const normalFill   = gleedsYellow.withAlpha(0.15);
    const normalStroke = gleedsYellow.withAlpha(0.9);

    let datasource, selectedEntity = null, hoveredEntity = null;

    Cesium.GeoJsonDataSource.load(WORLD_GEOJSON, {
      clampToGround: false,                   // floats over terrain (if enabled later)
      stroke: normalStroke,
      fill: normalFill,
      strokeWidth: 1
    }).then(ds => {
      datasource = ds;
      viewer.dataSources.add(ds);

      // Polygons for countries
      const entities = ds.entities.values;

      // Ensure a consistent baseline style
      for (const e of entities) {
        if (Cesium.defined(e.polygon)) {
          e.polygon.material     = normalFill;
          e.polygon.outline      = true;
          e.polygon.outlineColor = normalStroke;
          e.polygon.outlineWidth = 1.0;
        }
      }

      const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

      // Hover highlight
      handler.setInputAction((movement) => {
        const picked = viewer.scene.pick(movement.endPosition);
        // Clear previous hover if not selected
        if (hoveredEntity && hoveredEntity !== selectedEntity && hoveredEntity.polygon) {
          hoveredEntity.polygon.material = normalFill;
        }
        hoveredEntity = null;

        if (Cesium.defined(picked) && picked.id && picked.id.polygon) {
          hoveredEntity = picked.id;
          if (hoveredEntity !== selectedEntity) {
            hoveredEntity.polygon.material = hoverFill;
          }
        }
      }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

      // Click select + outline bold + flyTo
      handler.setInputAction((click) => {
        const picked = viewer.scene.pick(click.position);

        // Clear previous selection
        if (selectedEntity && selectedEntity.polygon) {
          selectedEntity.polygon.material     = normalFill;
          selectedEntity.polygon.outlineColor = normalStroke;
          selectedEntity.polygon.outlineWidth = 1.0;
        }
        selectedEntity = null;

        if (Cesium.defined(picked) && picked.id && picked.id.polygon) {
          selectedEntity = picked.id;
          selectedEntity.polygon.material     = hoverFill;
          selectedEntity.polygon.outlineColor = gleedsYellow;
          selectedEntity.polygon.outlineWidth = 3.0;

          // Smooth camera flight to the country
          viewer.flyTo(selectedEntity, { duration: 1.2, offset: new Cesium.HeadingPitchRange(0, -0.6, 2000000) });

          // Optional: put the country name into the URL (to link with your dashboard)
          const name = selectedEntity.properties?.name?.getValue() ||
                       selectedEntity.properties?.ADMIN?.getValue() ||
                       'country';
          const url = new URL(window.location.href);
          url.searchParams.set('country', name);
          history.replaceState({}, '', url.toString());
        }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

      // Start from a nice global view
      viewer.scene.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(0, 20, 4.0e7) // lon, lat, height (meters)
      });
    }).catch(err => {
      console.error('GeoJSON load error', err);
    });
  </script>
</body>
</html>
