<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive 3D Globe</title>

  <style>
    html, body { height: 100%; margin: 0; background:#000; color:#ddd; }
    #globeViz   { position: fixed; inset: 0; }
    .hud {
      position: fixed; left: 10px; top: 10px; z-index: 5;
      display: flex; gap: 8px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .btn {
      padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #111; color: #ddd;
      cursor: pointer; user-select: none;
    }
    .btn:hover { background: #1b1b1b; }
    .hint {
      position: fixed; left: 10px; bottom: 10px; font-size: 12px; color: #999; z-index: 5;
    }
  </style>

  <!-- LOCAL libraries – the same files your diagnostics loaded -->
  <script src="/assets/vendor/three.min.js"></script>
  <script src="/assets/vendor/OrbitControls.js"></script>
  <script src="/assets/vendor/d3-geo.v1.min.js"></script>
  <script src="/assets/vendor/three-globe.min.js"></script>
</head>

<body>
  <div class="hud">
    <button class="btn" id="btnWorld">Back to World</button>
    <button class="btn" id="btnReset">Reset View</button>
  </div>
  <div id="globeViz"></div>
  <div class="hint">Drag to spin • Scroll to zoom • Click a yellow country (USA shows states if overlay present)</div>

  <script>
    // ---------- CONFIG ----------
    const WORLD_GEOJSON = '/assets/world-110m.geojson';   // this exists (diagnostics green)
    const USA_STATES    = '/assets/overlays/usa-states.geojson'; // optional; ignore if not present
    const GLEEDS_YELLOW = '#FFC300';
    const GREY          = '#6a6a6a';
    const YELLOW_LIST   = new Set([
      'GBR','IRL','AUT','CZE','FRA','DEU','HUN','ITA','POL','PRT','ROU','SVK','ESP','UKR',
      'EGY','QAT','SAU','ARE',
      'AUS','CHN','HKG','IND','SGP','VNM',
      'CAN','PER','TTO','USA',
      'BGR','HRV','MNE','SRB','BEL','CHE','LUX','GRC','DNK','FIN','NLD','NOR','SWE',
      'ZAF','LKA','ECU'
    ]);

    // ---------- THREE scene ----------
    const container = document.getElementById('globeViz');
    const scene = new THREE.Scene();

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.z = 400;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.3;
    controls.zoomSpeed = 0.8;

    // Lights (without these you’ll often get a black screen)
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(-100, 200, 200);
    scene.add(dirLight);

    // ---------- Globe ----------
    const globe = new ThreeGlobe()
      .globeImageUrl('/assets/textures/earth-blue-marble.jpg')   // add these textures or use solid colors
      .bumpImageUrl('/assets/textures/earth-topology.png')
      .showAtmosphere(true)
      .atmosphereAltitude(0.18);

    scene.add(globe);

    // Countries layer
    let worldFeatures = [];
    fetch(WORLD_GEOJSON)
      .then(r => r.json())
      .then(gj => {
        worldFeatures = gj.features || [];
        globe
          .polygonsData(worldFeatures)
          .polygonCapColor(f => YELLOW_LIST.has(f.id) ? GLEEDS_YELLOW : GREY)
          .polygonSideColor(() => 'rgba(0,0,0,0.15)')
          .polygonStrokeColor(() => '#202020')
          .polygonAltitude(f => (YELLOW_LIST.has(f.id) ? 0.02 : 0.005))
          .polygonsTransitionDuration(300);

        // center on Atlantic
        globe.pointOfView({ lat: 18, lng: -20, altitude: 2.2 }, 1200);
      })
      .catch(e => {
        console.error('World GeoJSON failed:', e);
        alert('Could not load world boundaries from ' + WORLD_GEOJSON);
      });

    // Optional USA states overlay
    let usaStatesLayer = null;
    function loadUsaStates() {
      if (usaStatesLayer) { scene.remove(usaStatesLayer); usaStatesLayer = null; }
      fetch(USA_STATES)
        .then(r => r.ok ? r.json() : Promise.reject('missing'))
        .then(gj => {
          const states = gj.features || [];
          const statesGlobe = new ThreeGlobe()
            .globeImageUrl(null) // invisible globe shell for the layer
            .polygonsData(states)
            .polygonCapColor(() => GLEEDS_YELLOW)
            .polygonSideColor(() => 'rgba(0,0,0,0.25)')
            .polygonStrokeColor(() => '#1f1f1f')
            .polygonAltitude(() => 0.03)
            .polygonsTransitionDuration(200);
          usaStatesLayer = statesGlobe;
          scene.add(statesGlobe);
        })
        .catch(() => {
          // no states file—just skip silently
          console.warn('USA states overlay not found; skipping');
        });
    }

    // Click → zoom; if USA, also show states layer
    globe.onPolygonClick(f => {
      const name = f?.properties?.name || f?.id || '';
      const cc   = f?.id || '';
      const centroid = window.d3 ? window.d3.geoCentroid(f) : [0,0];
      const altitude =  cc === 'USA' ? 0.8 : 1.2;

      globe.pointOfView({ lat: centroid[1], lng: centroid[0], altitude }, 900);

      if (cc === 'USA') loadUsaStates();
      else if (usaStatesLayer) { scene.remove(usaStatesLayer); usaStatesLayer = null; }
    });

    // Buttons
    document.getElementById('btnWorld').onclick = () => {
      if (usaStatesLayer) { scene.remove(usaStatesLayer); usaStatesLayer = null; }
      globe.pointOfView({ lat: 18, lng: -20, altitude: 2.2 }, 900);
    };
    document.getElementById('btnReset').onclick = () => {
      if (usaStatesLayer) { scene.remove(usaStatesLayer); usaStatesLayer = null; }
      controls.reset();
      globe.pointOfView({ lat: 18, lng: -20, altitude: 2.2 }, 900);
    };

    // Resize handler
    window.addEventListener('resize', () => {
      const { innerWidth:w, innerHeight:h } = window;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });

    // Animate (without this the screen can look “frozen black”)
    (function animate(){
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
