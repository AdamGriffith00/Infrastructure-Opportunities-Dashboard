<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sectors • Infrastructure Opportunities and Budget Dashboard</title>
  <style>
    :root {
      --gleeds-yellow: #F7C400;
      --gleeds-dark: #3C3C3C;
      --gleeds-light: #F5F5F5;
      --card-bg: #2F2F2F;
      --card-border: #4A4A4A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--gleeds-dark);
      color: var(--gleeds-yellow);
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }
    header {
      padding: 28px 20px 10px;
      text-align: center;
    }
    .title {
      font-size: clamp(1.5rem, 2.5vw, 2rem);
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .subtitle {
      color: var(--gleeds-light);
      opacity: 0.85;
      font-size: 0.975rem;
      margin-top: 6px;
    }

    /* Centered grid of sector buttons */
    .container {
      display: grid;
      place-items: center;
      padding: 18px 20px 42px;
    }
    .sectors-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 16px;
      width: min(980px, 92vw);
      margin: 10px auto 0;
    }
    @media (max-width: 980px) {
      .sectors-grid { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
    }
    @media (max-width: 560px) {
      .sectors-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }

    .sector-card {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: white;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      height: 96px;
      position: relative;
      overflow: hidden;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .sector-card:before {
      /* subtle left accent using Gleeds yellow */
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 6px;
      height: 100%;
      background: var(--gleeds-yellow);
      opacity: 0.9;
    }
    .sector-card:hover {
      transform: translateY(-2px);
      border-color: #5c5c5c;
      box-shadow: 0 10px 20px rgba(0,0,0,0.45);
    }
    .sector-name {
      font-weight: 800;
      font-size: 1.25rem; /* increased size */
      letter-spacing: 0.4px;
      line-height: 1.1;
      text-transform: none;
    }

    footer {
      padding: 10px 16px 22px;
      text-align: center;
      color: var(--gleeds-light);
      opacity: 0.75;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1 class="title">Sectors</h1>
    <p class="subtitle">Choose a sector to view its Maps and Cheat Sheet.</p>
  </header>

  <main class="container" role="main">
    <nav class="sectors-grid" aria-label="Sectors">
      <a class="sector-card" href="Rail.html" aria-label="Rail">
        <span class="sector-name">Rail</span>
      </a>
      <a class="sector-card" href="Aviation.html" aria-label="Aviation">
        <span class="sector-name">Aviation</span>
      </a>
      <a class="sector-card" href="Maritime.html" aria-label="Maritime">
        <span class="sector-name">Maritime</span>
      </a>
      <a class="sector-card" href="Utilities.html" aria-label="Utilities">
        <span class="sector-name">Utilities</span>
      </a>
      <a class="sector-card" href="Highways.html" aria-label="Highways">
        <span class="sector-name">Highways</span>
      </a>
    </nav>
  </main>

  <footer>
    Infrastructure Opportunities and Budget Dashboard • Gleeds
  </footer>
</body>
</html>
