<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Infrastructure Opportunities and Budget Dashboard</title>
  <style>
    :root{
      --gleeds-yellow:#F7C400;
      --gleeds-dark:#3C3C3C;
      --gleeds-light:#F5F5F5;
      --card:#2F2F2F;
      --border:#4A4A4A;
      --active:#DA4F27; /* Copper Orange */
      --inactive:#3A3A3A;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--gleeds-dark);
      color: var(--gleeds-yellow);
      min-height:100vh;
      display:grid; grid-template-rows:auto 1fr auto;
    }
    header{padding:18px 16px 8px; text-align:center}
    .title{font-size: clamp(1.6rem, 2.6vw, 2.2rem); letter-spacing:.6px; font-weight:800}
    .subtitle{color:var(--gleeds-light); opacity:.85; font-size:.95rem; margin-top:6px}

    .nav{
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
      padding:14px 16px;
      border-top:1px solid var(--border);
      border-bottom:1px solid var(--border);
      background:#2b2b2b;
      flex-wrap:wrap; /* helps keep buttons centred on smaller screens */
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      min-width:140px; padding:12px 16px; border-radius:12px; text-decoration:none; cursor:default;
      font-weight:800; letter-spacing:.3px; border:1px solid var(--border);
      background: var(--inactive); color:#fff; transition: transform .14s ease, border-color .14s ease, background .14s ease;
      cursor:pointer;
    }
    .btn:hover{ transform: translateY(-1px); border-color: var(--active); }
    .btn.active{
      background: var(--active);
      border-color: var(--active);
      color:#000;
    }
        .main-tabs {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 20px;
      margin: 40px auto 30px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .main-tabs {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .main-tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

        .main-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 90px;
      width: 100%;
      padding: 12px 32px;
      border-radius: 18px;
      border: 2px solid #444;
      background-color: #333333;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
      transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.1s ease;
    }

    .main-tab:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.5);
    }

    .main-tab.active {
      background-color: #e85b0d; /* Gleeds orange */
      color: #ffffff;
    }
    main{display:grid; place-items:center; padding:24px 16px}
    .card{
      width:min(960px, 94vw); background:var(--card); border:1px solid var(--border); border-radius:14px;
      padding:18px; color:var(--gleeds-light); text-align:center; box-shadow:0 10px 24px rgba(0,0,0,.35);
    }
    footer{padding:12px 16px 18px; text-align:center; color:var(--gleeds-light); opacity:.75; font-size:.9rem}
  </style>
</head>
<body>
  <header>
    <div class="title">Infrastructure Opportunities and Budget Dashboard</div>
    <div class="subtitle">Gleeds • Internal View</div>
  </header>

  <div class="main-tabs">
    <a href="Overall.html" class="main-tab active">Overall</a>
    <a href="budget-summary.html" class="main-tab">Budget Summary</a>
    <a href="sectors.html" class="main-tab">Sectors</a>
    <a href="Regions.html" class="main-tab">Regions</a>
    <a href="disciplines.html" class="main-tab">Disciplines</a>
    <a href="LiveProjects.html" class="main-tab">Current Projects</a>
  </div>

  <main>
    <div class="card">
      <p>Use the navigation above to access each area. We’ll enable new sections as they’re ready.</p>
    </div>
  </main>

  <footer>© Gleeds • Last Updated Q4 2025</footer>
</body>
</html>
