<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Infrastructure Opportunities and Budget Dashboard</title>
  <style>
    :root{
      --gleeds-yellow:#F7C400;
      --gleeds-dark:#3C3C3C;
      --gleeds-light:#F5F5F5;
      --card:#2F2F2F;
      --border:#4A4A4A;
      --active:#DA4F27; /* Copper Orange */
      --inactive:#3A3A3A;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--gleeds-dark);
      color: var(--gleeds-yellow);
      min-height:100vh;
      display:grid; grid-template-rows:auto 1fr auto;
    }
    header{padding:18px 16px 8px; text-align:center}
    .title{font-size: clamp(1.6rem, 2.6vw, 2.2rem); letter-spacing:.6px; font-weight:800}
    .subtitle{color:var(--gleeds-light); opacity:.85; font-size:.95rem; margin-top:6px}

    .nav{
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
      padding:14px 16px;
      border-top:1px solid var(--border);
      border-bottom:1px solid var(--border);
      background:#2b2b2b;
      flex-wrap:wrap; /* helps keep buttons centred on smaller screens */
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      min-width:140px; padding:12px 16px; border-radius:12px; text-decoration:none; cursor:default;
      font-weight:800; letter-spacing:.3px; border:1px solid var(--border);
      background: var(--inactive); color:#fff; transition: transform .14s ease, border-color .14s ease, background .14s ease;
      pointer-events:none;
    }
    .btn.active{
      background: var(--active);
      border-color: var(--active);
      color:#000; cursor:pointer; pointer-events:auto;
    }
    .btn.active:hover{ transform: translateY(-1px); }
    main{display:grid; place-items:center; padding:24px 16px}
    .card{
      width:min(960px, 94vw); background:var(--card); border:1px solid var(--border); border-radius:14px;
      padding:18px; color:var(--gleeds-light); text-align:center; box-shadow:0 10px 24px rgba(0,0,0,.35);
    }
    footer{padding:12px 16px 18px; text-align:center; color:var(--gleeds-light); opacity:.75; font-size:.9rem}
  </style>
</head>
<body>
  <header>
    <div class="title">Infrastructure Opportunities and Budget Dashboard</div>
    <div class="subtitle">Gleeds • Internal View</div>
  </header>

  <nav class="nav" aria-label="Primary">
    <span class="btn" aria-disabled="true">Overall</span>
    <a class="btn active" href="sectors.html">Sectors</a>
    <a class="btn active" href="regions.html">Regions</a>
    <a class="btn active" href="disciplines.html">Disciplines</a>
    <a class="btn active" href="liveprojects.html">Current Projects</a>
  </nav>

  <main>
    <div class="card">
      <p>Use the navigation above to access each area. We’ll enable new sections as they’re ready.</p>
    </div>
  </main>

  <footer>© Gleeds • Last Updated Q4 2025</footer>
</body>
</html>
