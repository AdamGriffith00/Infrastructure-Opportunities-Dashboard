<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure Opportunities and Budget Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(60, 60, 60);
            color: rgb(247, 196, 0);
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo-container {
            margin-bottom: 2rem;
            margin-left: 45px;
        }

        .logo {
            max-width: 300px;
            height: auto;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        /* NAVIGATION: single row under the title */
        .navigation-buttons {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            width: 100%;
            max-width: 820px;
            padding: 0 2rem;
            justify-content: center;
            align-items: center;
        }

        .nav-button {
            background-color: rgb(120, 120, 120); /* grey for now */
            color: white;
            padding: 1rem 1.25rem;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: not-allowed; /* until links are added */
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            min-width: 160px;
            height: 64px;
            line-height: 1.2;
            opacity: 0.9;
        }

        .nav-button:hover {
            transform: translateY(-1px);
        }

        /* Keep hover visual subtle but don't change color (stays grey) */
        .nav-button.disabled:hover {
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .logo { max-width: 250px; }
            .title { font-size: 2rem; margin-bottom: 1.25rem; }

            .navigation-buttons {
                flex-wrap: wrap; /* wrap on small screens */
                gap: 0.75rem;
                padding: 0 1rem;
            }

            .nav-button {
                min-width: 140px;
                height: 56px;
                font-size: 1rem;
                padding: 0.8rem 1rem;
            }
        }

        @media (max-width: 480px) {
            .logo { max-width: 200px; }
            .title { font-size: 1.5rem; padding: 0 1rem; }
            .nav-button { min-width: 120px; }
        }
    </style>
</head>
