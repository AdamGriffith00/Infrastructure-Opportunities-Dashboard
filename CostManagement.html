<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cost Management • Infrastructure Opportunities and Budget Dashboard</title>
  <style>
    :root { --gleeds-yellow:#F7C400; --gleeds-dark:#3C3C3C; --gleeds-dark-2:#2F2F2F; --gleeds-light:#F5F5F5; --border:#4A4A4A; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--gleeds-dark);
      color: var(--gleeds-yellow);
      min-height:100vh;
      display:grid;
      grid-template-rows:auto auto 1fr auto; /* utility, toolbar, tabs, footer */
    }
    /* Utility bar */
    .utility-bar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:12px 16px; background:#2b2b2b; border-bottom:1px solid var(--border); }
    .utility-left, .utility-right { display:flex; gap:10px; align-items:center; }
    .utility-left { justify-content:flex-start; }
    .utility-center { text-align:center; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    .utility-right { justify-content:flex-end; }
    .back-btn { text-decoration:none; background:#3A3A3A; color:white; border:1px solid var(--border); padding:10px 14px; border-radius:10px; font-weight:700; letter-spacing:.3px; transition: transform .14s ease, border-color .14s ease, background .14s ease; }
    .back-btn:hover { transform: translateY(-1px); border-color:#5a5a5a; }
    .last-updated { color:var(--gleeds-dark); background:var(--gleeds-yellow); padding:6px 10px; border-radius:999px; font-size:.85rem; font-weight:800; display:inline-block; }

    /* Slim toolbar */
    .toolbar { display:flex; gap:8px; align-items:center; justify-content:center; background:#262626; border-bottom:1px solid var(--border); padding:8px 10px; }
    .tool-btn { appearance:none; border:1px solid var(--border); background:#3A3A3A; color:white; font-weight:800; letter-spacing:.2px; padding:8px 12px; border-radius:10px; cursor:pointer; transition: transform .14s ease, background .14s ease, border-color .14s ease; }
    .tool-btn:hover { transform: translateY(-1px); }
    .tool-btn[aria-pressed="true"] { background: var(--gleeds-yellow); color: var(--gleeds-dark); border-color: var(--gleeds-yellow); }

    /* Tabs */
    .tabs { width:min(1400px,96vw); margin:10px auto 14px; background:var(--gleeds-dark-2); border:1px solid var(--border); border-radius:14px; box-shadow:0 10px 24px rgba(0,0,0,.35); overflow:hidden; display:grid; grid-template-rows:auto 1fr; height:calc(100vh - 180px); }
    .tablist { display:flex; gap:6px; padding:10px; background:linear-gradient(0deg,rgba(0,0,0,.15),rgba(0,0,0,.15)); border-bottom:1px solid var(--border); }
    .tab-btn { appearance:none; border:1px solid var(--border); background:#3A3A3A; color:white; font-weight:800; letter-spacing:.3px; padding:12px 16px; border-radius:10px; cursor:pointer; transition: transform .14s ease, background .14s ease, border-color .14s ease; outline:none; }
    .tab-btn[aria-selected="true"] { background:var(--gleeds-yellow); color:var(--gleeds-dark); border-color:var(--gleeds-yellow); transform: translateY(-1px); }
    .tab-btn:hover { transform: translateY(-1px); }

    .panel { position:relative; padding:0; display:none; background:#1f1f1f; }
    .panel[aria-hidden="false"] { display:block; }

    /* Fill container */
    .panel-fill { width:100%; height:100%; position:relative; overflow:hidden; }
    .embed { width:100%; height:100%; border:0; background:#121212; }

    /* Zoom overlay (map only) */
    .zoom-wrap { width:100%; height:100%; display:grid; place-items:center; overflow:hidden; }
    .zoom-target { width:100%; height:100%; transform-origin:center center; }
    .zoom-controls { position:absolute; bottom:14px; right:14px; display:flex; gap:6px; }
    .zoom-btn { appearance:none; border:1px solid var(--border); background:#3A3A3A; color:white; font-weight:800; padding:8px 10px; border-radius:10px; cursor:pointer; }
    .zoom-btn:hover { transform: translateY(-1px); }
    .zoom-indicator { position:absolute; bottom:16px; left:16px; background:rgba(0,0,0,.45); color:white; padding:6px 10px; border-radius:999px; font-size:.85rem; }

    footer { text-align:center; padding:10px 12px 18px; color:var(--gleeds-light); opacity:.8; font-size:.9rem; }
    @media (max-width:600px){ .tabs { height: calc(100vh - 200px); } }
  </style>
</head>
<body>
  <div class="utility-bar">
    <div class="utility-left">
      <a class="back-btn" href="disciplines.html">← Back to Disciplines</a>
      <a class="back-btn" href="index.html">← Back to Home Page</a>
    </div>
    <div class="utility-center">COST MANAGEMENT</div>
    <div class="utility-right"><span class="last-updated">Last Updated Q4 2025</span></div>
  </div>

  <!-- Minimal toolbar: Full screen + Open map -->
  <div class="toolbar" role="toolbar" aria-label="View controls">
    <button id="btn-fullscreen" class="tool-btn" aria-pressed="false" title="Enter/exit fullscreen">Full screen</button>
    <a id="btn-open" class="tool-btn" href="CostManagementMap.html" target="_blank" rel="noopener">Open map in new tab</a>
  </div>

  <section class="tabs" role="region" aria-label="Cost Management content">
    <div role="tablist" class="tablist" aria-label="Cost Management tabs">
      <button id="tab-map" class="tab-btn" role="tab" aria-controls="panel-map" aria-selected="true">Map</button>
      <button id="tab-cheat" class="tab-btn" role="tab" aria-controls="panel-cheat" aria-selected="false">Cheat Sheet</button>
    </div>

    <div id="panel-map" class="panel" role="tabpanel" aria-labelledby="tab-map" aria-hidden="false">
      <div class="panel-fill">
        <div class="zoom-wrap">
          <div id="zoomTarget" class="zoom-target">
            <iframe class="embed" src="CostManagementMap.html" title="Cost Management Map"></iframe>
          </div>
          <div class="zoom-indicator" id="zoomIndicator">100%</div>
          <div class="zoom-controls">
            <button class="zoom-btn" id="zoomOut" title="Zoom out (−)">−</button>
            <button class="zoom-btn" id="zoomReset" title="Reset zoom (0)">100%</button>
            <button class="zoom-btn" id="zoomIn" title="Zoom in (+)">+</button>
          </div>
        </div>
      </div>
    </div>

    <div id="panel-cheat" class="panel" role="tabpanel" aria-labelledby="tab-cheat" aria-hidden="true">
      <div class="panel-fill">
        <iframe class="embed" src="CostManagementCheatSheet.html" title="Cost Management Cheat Sheet"></iframe>
      </div>
    </div>
  </section>

  <footer>Infrastructure Opportunities and Budget Dashboard • Gleeds</footer>

  <script>
    // Tabs
    const tabs = Array.from(document.querySelectorAll('.tab-btn'));
    const panels = Array.from(document.querySelectorAll('.panel'));
    function activateTab(nextId) {
      tabs.forEach(btn => {
        const selected = btn.id === nextId;
        btn.setAttribute('aria-selected', selected);
        btn.tabIndex = selected ? 0 : -1;
      });
      panels.forEach(panel => {
        const isActive = panel.getAttribute('aria-labelledby') === nextId;
        panel.setAttribute('aria-hidden', (!isActive).toString());
      });
    }
    tabs.forEach(btn => {
      btn.addEventListener('click', () => activateTab(btn.id));
      btn.addEventListener('keydown', (e) => {
        const i = tabs.indexOf(btn);
        if (e.key === 'ArrowRight') { const next = tabs[(i + 1) % tabs.length]; next.focus(); activateTab(next.id); }
        else if (e.key === 'ArrowLeft') { const prev = tabs[(i - 1 + tabs.length) % tabs.length]; prev.focus(); activateTab(prev.id); }
      });
    });
    function syncFromHash() { if (location.hash === '#cheat') activateTab('tab-cheat'); else activateTab('tab-map'); }
    window.addEventListener('hashchange', syncFromHash); syncFromHash();

    // Fullscreen
    const btnFs = document.getElementById('btn-fullscreen');
    function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function enterFs(){ const el=document.documentElement; return el.requestFullscreen? el.requestFullscreen(): el.webkitRequestFullscreen? el.webkitRequestFullscreen(): null; }
    function exitFs(){ return document.exitFullscreen? document.exitFullscreen(): document.webkitExitFullscreen? document.webkitExitFullscreen(): null; }
    function updateFsBtn(){ btnFs.setAttribute('aria-pressed', String(isFs())); }
    btnFs.addEventListener('click', async () => { try{ isFs()? await exitFs(): await enterFs(); } catch(e){ console.warn(e); } finally{ updateFsBtn(); } });
    document.addEventListener('fullscreenchange', updateFsBtn);
    document.addEventListener('webkitfullscreenchange', updateFsBtn);

    // Zoom controls (map panel only)
    const zoomTarget = document.getElementById('zoomTarget');
    const zoomIndicator = document.getElementById('zoomIndicator');
    let zoom = 1.0; // 100%
    const MIN_ZOOM = 0.5;
    const MAX_ZOOM = 2.0;
    const STEP = 0.1;

    function renderZoom(){
      zoomTarget.style.transform = `scale(${zoom})`;
      zoomIndicator.textContent = Math.round(zoom*100) + '%';
    }
    function clamp(val, min, max){ return Math.max(min, Math.min(max, val)); }
    document.getElementById('zoomIn').addEventListener('click', () => { zoom = clamp(zoom + STEP, MIN_ZOOM, MAX_ZOOM); renderZoom(); });
    document.getElementById('zoomOut').addEventListener('click', () => { zoom = clamp(zoom - STEP, MIN_ZOOM, MAX_ZOOM); renderZoom(); });
    document.getElementById('zoomReset').addEventListener('click', () => { zoom = 1.0; renderZoom(); });

    // Keyboard shortcuts: + / - / 0
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.ctrlKey || e.metaKey)) return;
      if (e.key === '+' || e.key === '=') { e.preventDefault(); zoom = clamp(zoom + STEP, MIN_ZOOM, MAX_ZOOM); renderZoom(); }
      if (e.key === '-' || e.key === '_') { e.preventDefault(); zoom = clamp(zoom - STEP, MIN_ZOOM, MAX_ZOOM); renderZoom(); }
      if (e.key === '0') { e.preventDefault(); zoom = 1.0; renderZoom(); }
    });

    // Optional: ctrl + wheel zoom
    document.querySelector('.zoom-wrap').addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      zoom = clamp(zoom + (e.deltaY < 0 ? STEP : -STEP), MIN_ZOOM, MAX_ZOOM);
      renderZoom();
    }, { passive:false });

    // Initial render
    renderZoom();
  </script>
</body>
</html>
