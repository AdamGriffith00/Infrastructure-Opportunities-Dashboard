<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disciplines • Infrastructure Opportunities and Budget Dashboard</title>
  <style>
    :root {
      --gleeds-yellow: #F7C400;
      --gleeds-dark: #3C3C3C;
      --gleeds-light: #F5F5F5;
      --card-bg: #2F2F2F;
      --card-border: #4A4A4A;
      --active: #DA4F27;
      --inactive: #3A3A3A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--gleeds-dark);
      color: var(--gleeds-yellow);
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      min-height: 100vh;
    }

    /* Utility bar */
    .utility-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #2b2b2b;
      border-bottom: 1px solid var(--card-border);
    }
    .utility-left, .utility-right { display: flex; gap: 10px; align-items: center; }
    .utility-left { justify-content: flex-start; }
    .utility-center { text-align: center; font-weight: 800; letter-spacing: .4px; }
    .utility-right { justify-content: flex-end; }
    .back-btn {
      text-decoration: none;
      background: #3A3A3A;
      color: white;
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: .3px;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }
    .back-btn:hover { transform: translateY(-1px); border-color: #5a5a5a; }

    header { padding: 16px 20px 6px; text-align: center; }
    .title { font-size: clamp(1.5rem, 2.5vw, 2rem); letter-spacing: .5px; font-weight: 700; }
    .subtitle { color: var(--gleeds-light); opacity: .85; font-size: .975rem; margin-top: 6px; }

        .main-tabs {
      display: grid;
      grid-template-columns: repeat(6, minmax(140px, 1fr));
      gap: 22px;
      align-items: start;
      max-width: 1100px;
      margin: 40px auto 30px;
    }

    .main-tab {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 18px;
      border: 2px solid #444;
      background-color: #333333;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 0 rgba(0,0,0,.45);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
    }

    .main-tab:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 0 rgba(0,0,0,.5);
    }

    .main-tab.active {
      background-color: #e85b0d; /* Gleeds orange */
      color: #ffffff;
    }

    @media (max-width: 1100px) {
      .main-tabs { grid-template-columns: repeat(3, minmax(160px, 1fr)); }
    }
    @media (max-width: 650px) {
      .main-tabs { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
    }

    /* Primary nav */
    .nav {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
      background: #2b2b2b;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 140px;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: .3px;
      border: 1px solid var(--card-border);
      background: var(--inactive);
      color: #fff;
      transition: transform .14s ease, border-color .14s ease, background .14s ease;
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--active); }
    .btn.active { background: var(--active); border-color: var(--active); color: #000; }

    .container { display: grid; place-items: center; padding: 14px 20px 32px; }
    .disciplines-grid {
      display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 16px; width: min(980px, 92vw); margin: 6px auto 0;
    }
    @media (max-width: 980px) { .disciplines-grid { grid-template-columns: repeat(2, minmax(200px, 1fr)); } }
    @media (max-width: 560px) { .disciplines-grid { grid-template-columns: repeat(1, minmax(220px, 1fr)); } }

    .discipline-card {
      display: flex; align-items: center; justify-content: center; text-decoration: none; color: white;
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; height: 96px; position: relative; overflow: hidden;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      box-shadow: 0 6px 14px rgba(0,0,0,.35); isolation: isolate;
      font-weight: 800; font-size: 1.1rem; letter-spacing: .3px; text-align: center; padding: 0 14px;
      cursor: pointer;
    }
    .discipline-card:before { content: ""; position: absolute; left: 0; top: 0; width: 6px; height: 100%; background: var(--gleeds-yellow); opacity: .9; }
    .discipline-card:hover { transform: translateY(-2px); border-color: #5c5c5c; box-shadow: 0 10px 20px rgba(0,0,0,.45); }

    footer { padding: 10px 16px 22px; text-align: center; color: var(--gleeds-light); opacity: .75; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="utility-bar">
    <div class="utility-left">
    </div>
    <div class="utility-center"></div>
    <div class="utility-right"></div>
  </div>

  <header>
    <h1 class="title">Disciplines</h1>
    <p class="subtitle">Choose a discipline to view its Map and Cheat Sheet.</p>
  </header>

  <div class="main-tabs">
    <a href="Overall.html" class="main-tab">Overall</a>
    <a href="budget-summary.html" class="main-tab">Budget Summary</a>
    <a href="sectors.html" class="main-tab">Sectors</a>
    <a href="Regions.html" class="main-tab">Regions</a>
    <a href="disciplines.html" class="main-tab active">Disciplines</a>
    <a href="LiveProjects.html" class="main-tab">Current Projects</a>
  </div>

  <main class="container" role="main">
    <nav class="disciplines-grid" aria-label="Disciplines">
      <a class="discipline-card" href="CostManagement.html" aria-label="Cost Management">Cost Management</a>
      <a class="discipline-card" href="ProjectManagement.html" aria-label="Project Management">Project Management</a>
      <a class="discipline-card" href="ProjectControls.html" aria-label="Project Controls">Project Controls</a>
      <a class="discipline-card" href="Advisory.html" aria-label="Advisory">Advisory</a>
    </nav>
  </main>

  <footer>Infrastructure Opportunities and Budget Dashboard • Gleeds</footer>
</body>
</html>
