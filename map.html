<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MapLibre Interactive Globe</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <link
    href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
    rel="stylesheet"
  />
  <style>
    body { margin:0; padding:0; }
    #map {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://demotiles.maplibre.org/style.json',
      center: [0, 20],
      zoom: 1.5,
      projection: 'globe' // Turn on globe mode
    });

    map.on('style.load', () => map.setFog({})); // adds subtle atmospheric effect

    // Load a GeoJSON of world countries (example URL, replace with yours)
    map.addSource('countries', {
      type: 'geojson',
      data: 'https://geojson-maps.ash.ms/world.geo.json'
    });

    map.addLayer({
      id: 'country-fills',
      type: 'fill',
      source: 'countries',
      paint: {
        'fill-color': '#f7c400',
        'fill-opacity': 0.2
      }
    });

    map.addLayer({
      id: 'country-borders',
      type: 'line',
      source: 'countries',
      paint: {
        'line-color': '#f7c400',
        'line-width': 1
      }
    });

    map.on('click', 'country-fills', (e) => {
      const [lon, lat] = e.lngLat.toArray();
      map.flyTo({ center: [lon, lat], zoom: 4, speed: 0.5 });
    });
  </script>
</body>
</html>
